<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Assistant · agentkit</title>
<!--
  A chat assistant over @agentkit (#155).

  No framework and no build step, so what you see is the platform's behaviour rather than a bundler's. It is also
  the first place the runtime's streaming, approval and question paths are driven by a person at all — the
  frontend components' tests use `renderToStaticMarkup`, so there is no DOM and no clicks, and a handler wired to
  the wrong prop is otherwise undetectable.

  An earlier version of this page was deliberately unstyled, on the theory that a test surface which looks
  designed gets argued about instead of used. That was the wrong call: something you are meant to *use* while
  judging an assistant's answers has to be pleasant enough to read them in.
-->
<style>
  :root {
    --bg:#fbfbfc; --panel:#fff; --fg:#16171a; --muted:#6b6f76; --faint:#9aa0a6;
    --line:#e6e7ea; --accent:#2f6feb; --accent-soft:#eef3fe;
    --me:#2f6feb; --me-fg:#fff; --bot:#f3f4f6;
    --warn:#9a6200; --warn-bg:#fff8e6; --warn-line:#f0d9a0; --err:#b4232a; --ok:#1a7f45;
    --radius:14px; --shadow:0 1px 2px rgba(16,17,26,.06), 0 8px 24px rgba(16,17,26,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0f1012; --panel:#16181c; --fg:#e9eaec; --muted:#9ba1a9; --faint:#6c737c;
      --line:#24272d; --accent:#5b8dff; --accent-soft:#1a2233;
      --me:#3f6fd8; --me-fg:#fff; --bot:#1d2025;
      --warn:#e0ab4a; --warn-bg:#2a2113; --warn-line:#4a3a1a; --err:#f07178; --ok:#5cc98c;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
    }
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body {
    margin:0; background:var(--bg); color:var(--fg);
    font:15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
    display:grid; grid-template-columns:264px minmax(0,1fr);
  }
  @media (max-width:820px) { body { grid-template-columns:1fr; } aside { display:none; } }

  /* ---------------------------------------------------------------- sidebar */
  aside { background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  .brand { padding:18px 18px 12px; font-weight:600; letter-spacing:-.01em; display:flex; align-items:center; gap:9px; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--ok); box-shadow:0 0 0 3px color-mix(in srgb, var(--ok) 20%, transparent); }
  .dot.off { background:var(--faint); box-shadow:none; }
  .newchat { margin:0 14px 12px; padding:9px 12px; border:1px solid var(--line); border-radius:10px;
             background:transparent; color:inherit; font:inherit; cursor:pointer; text-align:left; }
  .newchat:hover { background:var(--bot); }
  .side-h { padding:6px 18px; font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--faint); }
  .convs { flex:1; overflow:auto; padding:0 10px 10px; }
  .conv { padding:8px 10px; margin:1px 0; border-radius:9px; cursor:pointer; font-size:13.5px; color:var(--muted);
          overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .conv:hover { background:var(--bot); color:var(--fg); }
  .conv.active { background:var(--accent-soft); color:var(--fg); font-weight:500; }
  .modes { border-top:1px solid var(--line); padding:12px 14px 10px; }
  .modes label { font-size:11px; color:var(--faint); display:block; margin-bottom:6px; }
  .seg { display:flex; border:1px solid var(--line); border-radius:9px; overflow:hidden; }
  .seg button { flex:1; font:inherit; font-size:12.5px; padding:6px 4px; border:0; background:transparent;
                color:var(--muted); cursor:pointer; }
  .seg button + button { border-left:1px solid var(--line); }
  .seg button.on { background:var(--accent); color:#fff; }
  .modehint { font-size:11.5px; color:var(--faint); margin-top:6px; line-height:1.45; }

  /* the option picker for ask_user */
  .opts { display:grid; gap:6px; margin:9px 0 4px; }
  .opt { display:flex; gap:9px; align-items:flex-start; border:1px solid var(--warn-line); border-radius:9px;
         padding:8px 11px; cursor:pointer; background:var(--panel); font-size:13.5px; }
  .opt:hover { border-color:var(--warn); }
  .opt.on { border-color:var(--warn); background:var(--warn-bg); }
  .opt input { margin:3px 0 0; accent-color:var(--warn); }
  .who { border-top:1px solid var(--line); padding:12px 14px; display:grid; gap:7px; }
  .who label { font-size:11px; color:var(--faint); display:block; margin-bottom:2px; }
  .who input, .who select { width:100%; padding:6px 9px; font:inherit; font-size:13px; border:1px solid var(--line);
                            border-radius:8px; background:var(--bg); color:inherit; }

  /* ---------------------------------------------------------------- chat */
  main { display:flex; flex-direction:column; min-width:0; min-height:0; }
  #log { flex:1; overflow-y:auto; padding:28px 0 8px; }
  .wrap { max-width:44rem; margin:0 auto; padding:0 24px; }
  .turn { display:flex; gap:12px; margin-bottom:22px; align-items:flex-start; }
  .turn.me { flex-direction:row-reverse; }
  .av { flex:0 0 28px; width:28px; height:28px; border-radius:8px; display:grid; place-items:center;
        font-size:12px; font-weight:600; margin-top:2px; }
  .av.bot { background:var(--bot); color:var(--muted); }
  .av.me  { background:var(--me); color:var(--me-fg); }
  .bubble { min-width:0; }
  .turn.me .bubble { background:var(--me); color:var(--me-fg); padding:10px 14px; border-radius:var(--radius);
                     border-top-right-radius:5px; max-width:min(38rem,100%); }
  .turn.bot .bubble { padding-top:2px; }
  .bubble p { margin:0 0 .7em; } .bubble p:last-child { margin-bottom:0; }
  .bubble h1,.bubble h2,.bubble h3 { font-size:1.03em; margin:1.1em 0 .4em; line-height:1.35; }
  .bubble ul,.bubble ol { margin:.2em 0 .8em; padding-left:1.35em; }
  .bubble li { margin:.18em 0; }
  .bubble code { font:13px/1.5 ui-monospace, SFMono-Regular, monospace; background:var(--bot);
                 padding:1.5px 5px; border-radius:5px; }
  .turn.me .bubble code { background:rgba(255,255,255,.18); }
  .bubble pre { background:var(--bot); padding:11px 13px; border-radius:10px; overflow-x:auto; margin:.5em 0 .9em; }
  .bubble pre code { background:none; padding:0; }
  .bubble table { border-collapse:collapse; margin:.4em 0 .9em; font-size:14px; display:block; overflow-x:auto; }
  .bubble th,.bubble td { border:1px solid var(--line); padding:5px 9px; text-align:left; }
  .bubble blockquote { margin:.4em 0; padding-left:11px; border-left:3px solid var(--line); color:var(--muted); }
  .caret { display:inline-block; width:7px; height:1.05em; background:var(--fg); vertical-align:-2px;
           margin-left:2px; animation:blink 1.05s steps(2) infinite; }
  @keyframes blink { 50% { opacity:0 } }

  /* tool trace, collapsed by default so it does not compete with the answer */
  .trace { margin:2px 0 8px; }
  .trace summary { cursor:pointer; font-size:12.5px; color:var(--faint); list-style:none; }
  .trace summary::-webkit-details-marker { display:none; }
  .trace summary::before { content:"▸ "; }
  .trace[open] summary::before { content:"▾ "; }
  .trace ol { margin:6px 0 0; padding-left:18px; font:12.5px/1.7 ui-monospace, monospace; color:var(--muted); }
  .trace .bad { color:var(--err); }
  .trace .good { color:var(--ok); }

  .gate { border:1px solid var(--warn-line); background:var(--warn-bg); border-radius:var(--radius);
          padding:14px 16px; margin:2px 0 10px; }
  .gate h4 { margin:0 0 3px; font-size:13px; color:var(--warn); letter-spacing:.01em; }
  .gate .d { font-size:14px; margin-bottom:9px; }
  .gate button { font:inherit; font-size:13.5px; padding:7px 15px; margin-right:8px; border-radius:9px;
                 border:1px solid var(--warn-line); background:var(--panel); color:inherit; cursor:pointer; }
  .gate button.primary { background:var(--warn); border-color:var(--warn); color:#fff; }
  .gate input { font:inherit; font-size:13.5px; padding:7px 10px; border:1px solid var(--warn-line);
                border-radius:9px; background:var(--panel); color:inherit; margin-right:8px; min-width:16rem; }
  /* The plan-ready bar. Accent rather than warn: offering to act is not a warning, and colouring it like the
     approval gate would make the two read as the same kind of decision. */
  .planbar { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin:10px 0 2px;
             padding:11px 14px; border:1px solid var(--accent); border-radius:var(--radius);
             background:var(--accent-soft); font-size:13.5px; }
  .planbar span { flex:1 1 14rem; color:var(--muted); }
  .planbar button { font:inherit; font-size:13.5px; padding:7px 15px; border-radius:9px; cursor:pointer;
                    border:1px solid var(--accent); background:var(--accent); color:#fff; }
  .planbar button:disabled { opacity:.6; cursor:default; }
  .note { font-size:12.5px; color:var(--faint); text-align:center; margin:14px 0; }
  .note.bad { color:var(--err); }

  .empty { max-width:44rem; margin:8vh auto; padding:0 24px; }
  .empty h2 { font-size:22px; letter-spacing:-.02em; margin:0 0 6px; }
  .empty p { color:var(--muted); margin:0 0 20px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { border:1px solid var(--line); background:var(--panel); border-radius:20px; padding:7px 14px;
          font:inherit; font-size:13.5px; cursor:pointer; color:var(--muted); }
  .chip:hover { border-color:var(--accent); color:var(--fg); }

  /* ---------------------------------------------------------------- composer */
  .composer { border-top:1px solid var(--line); background:var(--bg); padding:14px 0 18px; }
  .composer .wrap { display:flex; gap:10px; align-items:flex-end; }
  textarea { flex:1; resize:none; font:inherit; padding:11px 14px; border:1px solid var(--line);
             border-radius:var(--radius); background:var(--panel); color:inherit; max-height:9.5rem;
             box-shadow:var(--shadow); }
  textarea:focus { outline:none; border-color:var(--accent); }
  .go { width:40px; height:40px; flex:0 0 40px; border:0; border-radius:12px; background:var(--accent);
        color:#fff; font-size:17px; cursor:pointer; display:grid; place-items:center; }
  .go:disabled { opacity:.35; cursor:default; }
  .hint { font-size:11.5px; color:var(--faint); margin:7px auto 0; max-width:44rem; padding:0 24px; }
</style>

<aside>
  <div class="brand"><span class="dot" id="health"></span> Assistant</div>
  <button class="newchat" id="new">＋  New conversation</button>
  <div class="side-h">Conversations</div>
  <div class="convs" id="convs"></div>
  <div class="modes">
    <label>Mode</label>
    <div class="seg" id="modes"></div>
    <div class="modehint" id="modehint"></div>
  </div>
  <div class="who">
    <div><label>Workspace</label><input id="tenant" value="demo" /></div>
    <div><label>You</label><input id="principal" value="you" /></div>
    <div><label>Role</label>
      <select id="role"><option value="editor">editor — can write &amp; share</option><option value="viewer">viewer — read only</option></select>
    </div>
  </div>
</aside>

<main>
  <div id="log"></div>
  <div class="composer">
    <div class="wrap">
      <textarea id="text" rows="1" placeholder="Message the assistant…"></textarea>
      <button class="go" id="send" title="Send">↑</button>
    </div>
    <div class="hint">Enter to send · Shift+Enter for a new line</div>
  </div>
</main>

<script type="module">
  const $ = (id) => document.getElementById(id);
  const log = $("log");
  let conversationId = null;
  const seen = new Set();

  const headers = () => ({
    "content-type": "application/json",
    // The dev authenticator reads these. This is not authentication — any caller can claim any workspace, which
    // is exactly why the server refuses to start without AGENTKIT_EXAMPLE_DEV_AUTH=1.
    "x-agentkit-tenant": $("tenant").value.trim(),
    "x-agentkit-principal": $("principal").value.trim(),
    "x-agentkit-roles": $("role").value,
  });

  const gql = async (query, variables = {}) => {
    const r = await fetch("/graphql", { method: "POST", headers: headers(), body: JSON.stringify({ query, variables }) });
    const j = await r.json();
    if (j.errors) throw new Error(j.errors[0].message);
    return j.data;
  };

  /* ------------------------------------------------------- rendering */

  const atBottom = () => log.scrollHeight - log.scrollTop - log.clientHeight < 90;
  const follow = (was) => { if (was) log.scrollTop = log.scrollHeight; };

  const wrap = () => {
    const d = document.createElement("div");
    d.className = "wrap";
    return d;
  };

  const turn = (who) => {
    const was = atBottom();
    const w = wrap();
    const t = document.createElement("div");
    t.className = `turn ${who === "me" ? "me" : "bot"}`;
    const av = document.createElement("div");
    av.className = `av ${who === "me" ? "me" : "bot"}`;
    av.textContent = who === "me" ? ($("principal").value.trim()[0] || "?").toUpperCase() : "✦";
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    t.append(av, bubble);
    w.append(t);
    log.append(w);
    follow(was);
    return bubble;
  };

  const note = (text, bad = false) => {
    const was = atBottom();
    const w = wrap();
    const d = document.createElement("div");
    d.className = `note${bad ? " bad" : ""}`;
    d.textContent = text;
    w.append(d);
    log.append(w);
    follow(was);
  };

  /**
   * A deliberately small Markdown renderer.
   *
   * Escapes first, then applies a fixed set of patterns — so model output cannot inject HTML. Pulling in a
   * Markdown library would mean a build step, and pulling one from a CDN would mean the page no longer works
   * offline; neither is worth it for headings, lists, code, tables and emphasis.
   */
  const md = (src) => {
    const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
    /**
     * Flatten the LaTeX models emit for arithmetic.
     *
     * `gpt-4o` answers "19*37+4" as `\(19 \times 37 + 4\)`, which rendered literally — backslashes, parens and
     * all. Rendering real maths would mean KaTeX and a build step; for a chat surface, unwrapping the delimiters
     * and mapping the handful of operators that actually show up reads correctly and costs nothing.
     *
     * Applied before escaping so the replacements are on the raw text, and deliberately narrow: an unrecognised
     * command is left alone rather than mangled.
     */
    const delatex = (s) =>
      s
        .replace(/\\[()[\]]/g, "")
        .replace(/\$\$?([^$]+)\$\$?/g, "$1")
        .replace(/\\times/g, "×")
        .replace(/\\div/g, "÷")
        .replace(/\\cdot/g, "·")
        .replace(/\\pm/g, "±")
        .replace(/\\leq/g, "≤")
        .replace(/\\geq/g, "≥")
        .replace(/\\neq/g, "≠")
        .replace(/\\approx/g, "≈")
        .replace(/\\text\{([^}]*)\}/g, "$1")
        .replace(/\\frac\{([^}]*)\}\{([^}]*)\}/g, "$1/$2");

    const inline = (s) =>
      esc(delatex(s))
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        .replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<em>$2</em>")
        // Bare URLs only — a `[text](url)` form would need care about `javascript:`, and models rarely emit one
        // here. Restricted to http(s) for the same reason.
        .replace(/\bhttps?:\/\/[^\s<)]+/g, (u) => `<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`);

    const out = [];
    const lines = src.split("\n");
    let i = 0;
    while (i < lines.length) {
      const line = lines[i];
      if (/^```/.test(line)) {
        const body = [];
        i += 1;
        while (i < lines.length && !/^```/.test(lines[i])) body.push(lines[i++]);
        i += 1;
        out.push(`<pre><code>${esc(body.join("\n"))}</code></pre>`);
        continue;
      }
      const h = /^(#{1,4})\s+(.*)$/.exec(line);
      if (h) { out.push(`<h3>${inline(h[2])}</h3>`); i += 1; continue; }
      if (/^\s*[-*]\s+/.test(line)) {
        const items = [];
        while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) items.push(inline(lines[i++].replace(/^\s*[-*]\s+/, "")));
        out.push(`<ul>${items.map((t) => `<li>${t}</li>`).join("")}</ul>`);
        continue;
      }
      if (/^\s*\d+[.)]\s+/.test(line)) {
        const items = [];
        while (i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])) items.push(inline(lines[i++].replace(/^\s*\d+[.)]\s+/, "")));
        out.push(`<ol>${items.map((t) => `<li>${t}</li>`).join("")}</ol>`);
        continue;
      }
      if (/^\s*\|.*\|\s*$/.test(line)) {
        const rows = [];
        while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) rows.push(lines[i++]);
        const cells = (r) => r.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
        const head = cells(rows[0]);
        const body = rows.slice(/^[\s|:-]+$/.test(rows[1] ?? "") ? 2 : 1);
        out.push(
          `<table><thead><tr>${head.map((c) => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>` +
            body.map((r) => `<tr>${cells(r).map((c) => `<td>${inline(c)}</td>`).join("")}</tr>`).join("") +
            `</tbody></table>`,
        );
        continue;
      }
      if (/^\s*>\s?/.test(line)) { out.push(`<blockquote>${inline(line.replace(/^\s*>\s?/, ""))}</blockquote>`); i += 1; continue; }
      if (line.trim() === "") { i += 1; continue; }
      const para = [];
      while (i < lines.length && lines[i].trim() !== "" && !/^(```|#{1,4}\s|\s*[-*]\s|\s*\d+[.)]\s|\s*\||\s*>)/.test(lines[i]))
        para.push(lines[i++]);
      out.push(`<p>${inline(para.join("\n")).replace(/\n/g, "<br>")}</p>`);
    }
    return out.join("");
  };

  /* ------------------------------------------------------- the stream */

  /** One assistant turn's live state: its bubble, its collapsed tool trace, and the text so far. */
  const newTurnState = () => ({ bubble: null, trace: null, steps: null, text: "" });

  const traceFor = (st) => {
    if (st.trace) return st.trace;
    const d = document.createElement("details");
    d.className = "trace";
    const s = document.createElement("summary");
    s.textContent = "tools";
    const ol = document.createElement("ol");
    d.append(s, ol);
    st.bubble.append(d);
    st.trace = d;
    st.steps = ol;
    return d;
  };
  const step = (st, text, cls = "") => {
    traceFor(st);
    const li = document.createElement("li");
    li.className = cls;
    li.textContent = text;
    st.steps.append(li);
    st.trace.querySelector("summary").textContent =
      `tools — ${st.steps.children.length} call${st.steps.children.length === 1 ? "" : "s"}`;
  };

  const paint = (st) => {
    const was = atBottom();
    st.bubble.querySelector(".body")?.remove();
    const body = document.createElement("div");
    body.className = "body";
    body.innerHTML = md(st.text) + '<span class="caret"></span>';
    st.bubble.append(body);
    follow(was);
  };

  const render = (event, st, runId) => {
    const key = `${runId}:${event.sequence ?? Math.random()}`;
    // The stream is resumable, so a frame can arrive twice. Deduping on sequence stops a reconnect doubling the
    // reply.
    if (seen.has(key)) return;
    seen.add(key);
    const type = event.type ?? "";

    if (type === "part.added" || type === "part.updated") {
      const part = event.part ?? {};
      if (part.type === "text") {
        if (!st.bubble) st.bubble = turn("bot");
        st.text = part.text ?? "";
        paint(st);
      }
      return;
    }
    if (!st.bubble) st.bubble = turn("bot");
    if (type === "tool.started") step(st, `→ ${event.toolName ?? "tool"}`);
    else if (type === "tool.completed") step(st, `✓ ${event.toolName ?? "tool"}`, "good");
    else if (type === "tool.failed") step(st, `✗ ${event.toolName ?? "tool"} — ${event.error?.message ?? "failed"}`, "bad");
    else if (type === "approval.requested") void approvalGate(runId, st, event);
    else if (type === "question.requested") void askGate(event, runId, st);
    else if (type === "run.failed") note(`The run failed: ${event.error?.message ?? "unknown error"}`, true);
  };

  const settle = (st) => {
    st.bubble?.querySelector(".caret")?.remove();
    $("send").disabled = false;
    $("text").focus();
    /**
     * A reply that settles in plan mode *is* a plan, so this is where the button belongs.
     *
     * Attached to the bubble rather than floated somewhere global: a plan two turns up is not the plan being
     * offered, and a button that outlives its plan would run the wrong one. `paintPlanBar` clears the old one.
     */
    if (mode === "plan" && st.bubble && st.text) paintPlanBar(st.bubble);
  };

  /**
   * The "Execute plan" bar.
   *
   * Only ever one, under the newest plan. It is removed on the way in rather than tracked, because the states
   * that can put one on screen — a plan settling, and reopening a conversation whose last turn was a plan — do
   * not otherwise know about each other.
   */
  const paintPlanBar = (bubble) => {
    for (const old of log.querySelectorAll(".planbar")) old.remove();
    const bar = document.createElement("div");
    bar.className = "planbar";
    bar.innerHTML = `<span>Plan ready. Executing it leaves plan mode and asks before anything irreversible.</span>`;
    const go = document.createElement("button");
    go.textContent = "Execute plan";
    go.onclick = () => void executePlan(bar);
    bar.append(go);
    bubble.append(bar);
    bubble.scrollIntoView({ block: "end", behavior: "smooth" });
  };

  const executePlan = async (bar) => {
    const button = bar.querySelector("button");
    button.disabled = true;
    button.textContent = "Executing…";
    try {
      const r = await fetch("/api/plan/execute", {
        method: "POST", headers: headers(),
        body: JSON.stringify({ conversationId }),
      });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error ?? r.statusText);
      bar.remove();
      // The server sent a real user message on the person's behalf, so the transcript shows one. Reading the
      // text back from the response rather than repeating it here keeps the two from drifting apart.
      mode = j.mode;
      paintModes();
      turn("me").textContent = j.text;
      $("send").disabled = true;
      note(`Executing the plan in ${j.mode} mode.`);
      void stream(j.runId);
    } catch (e) {
      button.disabled = false;
      button.textContent = "Execute plan";
      note(`Could not execute the plan: ${e.message}`, true);
    }
  };

  /**
   * Read the SSE stream with `fetch`, not `EventSource`.
   *
   * `EventSource` cannot set request headers, and the dev authenticator reads the workspace from one — so an
   * EventSource connection could never be authenticated. Reading the body as a stream is the only shape that
   * carries headers.
   */
  const stream = async (runId, st = newTurnState()) => {
    const r = await fetch(
      `/runs/events?runId=${encodeURIComponent(runId)}&conversationId=${encodeURIComponent(conversationId)}`,
      { headers: { ...headers(), accept: "text/event-stream" } },
    );
    if (!r.ok) { note(`Could not open the stream (${r.status}).`, true); settle(st); return; }
    const reader = r.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      // Frames are separated by a blank line. Splitting per line would reassemble a multi-line `data:` wrongly.
      const frames = buffer.split("\n\n");
      buffer = frames.pop() ?? "";
      for (const frame of frames) {
        const data = frame.split("\n").filter((l) => l.startsWith("data:")).map((l) => l.slice(5).trim()).join("");
        if (!data) continue;
        try {
          /**
           * The frame is a **GraphQL-SSE envelope**, not a bare event.
           *
           * `graphql-sse` sends `{"data":{"runEvents":{…}}}` — the subscription field name is part of the payload.
           * Reading `JSON.parse(data)` as the event directly gave `type: undefined` for every frame, so 58 frames
           * arrived and none rendered: it looked exactly like no streaming at all, which is how this hid behind a
           * real streaming bug.
           *
           * Unwrapped tolerantly rather than assuming the envelope, since the route also accepts an `EventSource`
           * caller that would see a different shape.
           */
          const frame = JSON.parse(data);
          const event = frame?.data?.runEvents ?? frame?.runEvents ?? frame;
          render(event, st, runId);
        } catch { /* keep-alive or partial frame */ }
      }
    }
    settle(st);
  };

  /* ------------------------------------------------------- gates */

  /**
   * The question's own text and options, fetched before the picker is drawn — #163.
   *
   * `question.requested` carries only an `interactionId`; events are thin on purpose. This page used to read
   * `event.questions`, which was never there, so the card rendered as a bare "Your answer" box with no prompt
   * and no options — the picker looked built and was unusable. `pendingQuestion` is the platform query that
   * closes that gap.
   */
  const askGate = async (event, runId, st) => {
    let questions = [];
    let interactionId = event.interactionId;
    try {
      const data = await gql(
        `query($r: ID!){ pendingQuestion(runId: $r){ interactionId questions{ key prompt options multiple allowOther } } }`,
        { r: runId },
      );
      questions = data?.pendingQuestion?.questions ?? [];
      // On the reopen path there is no event to take the id from, so the query is the only source.
      if (data?.pendingQuestion?.interactionId) interactionId = data.pendingQuestion.interactionId;
    } catch (e) {
      note(`Could not read the question: ${e.message}`, true);
    }
    if (!interactionId) return;
    event = { ...event, interactionId };
    // Drawn even if the fetch failed: a free-text box the person can answer beats a run parked with no card at
    // all, and `allowOther` defaults to true when there are no options.
    gate({ ...event, questions }, runId, "question", st);
  };

  /**
   * The approval's summary and tool name, fetched before the card is drawn — #163.
   *
   * `approval.requested` carries only an `interactionId` too, so this card fell back to "Run a tool? This
   * cannot be undone." — asking someone to authorise an action it could not name. `pendingApproval` is the
   * query that fixes it.
   */
  const approvalGate = async (runId, st, event = {}) => {
    let detail = null;
    try {
      const data = await gql(
        `query($r: ID!){ pendingApproval(runId: $r){ interactionId toolName summary riskCategory } }`,
        { r: runId },
      );
      detail = data?.pendingApproval ?? null;
    } catch (e) {
      note(`Could not read the approval: ${e.message}`, true);
    }
    // Already decided, or gone: nothing to ask. Drawing an undecidable card would be worse than none.
    if (detail === null && !event.interactionId) return;
    gate({ ...event, ...(detail ?? {}) }, runId, "approval", st);
  };

  const gate = (event, runId, kind, st) => {
    const id = event.interactionId;
    if (!id) return;
    const box = document.createElement("div");
    box.className = "gate";
    const h = document.createElement("h4");
    h.textContent = kind === "approval" ? "Approval needed" : "The assistant has a question";
    const d = document.createElement("div");
    d.className = "d";
    // The summary comes from `pendingApproval` now, so this names the actual act rather than "a tool" (#163).
    d.textContent = kind === "approval"
      ? (event.summary ?? `Run ${event.toolName ?? "a tool"}?`) + " This cannot be undone."
      : (event.questions ?? []).map((q) => q.prompt).join(" ");
    box.append(h, d);
    st.bubble.append(box);
    const done = (label) => { box.innerHTML = `<h4>${label}</h4>`; };

    if (kind === "approval") {
      for (const [label, decision, primary] of [["Approve", "allow-once", true], ["Deny", "deny", false]]) {
        const b = document.createElement("button");
        if (primary) b.className = "primary";
        b.textContent = label;
        b.onclick = async () => {
          try {
            // The platform's own mutation. The run resumes because `decideApproval` transitions it back to
            // `queued` and re-enqueues — and because the queue now clears the finished job holding that id (#156).
            await gql(`mutation($i: ApprovalDecisionInput!){ decideApproval(input: $i) }`,
              { i: { interactionId: id, runId, decision } });
            done(label === "Approve" ? "Approved" : "Denied");
            $("send").disabled = true;
            void stream(runId, st);
          } catch (e) { note(`Could not record the decision: ${e.message}`, true); }
        };
        box.append(b);
      }
    } else {
      /**
       * The option picker — single, multiple, or free text (#155).
       *
       * Driven entirely by the question's own `options` / `multiple` / `allowOther` fields, which is why those
       * were added to the platform: without them this had to guess, and a guess is wrong the first time somebody
       * asks a multi-select.
       */
      const q = (event.questions ?? [])[0] ?? { key: "answer" };
      const options = Array.isArray(q.options) ? q.options : [];
      const multiple = q.multiple === true;
      const allowOther = q.allowOther === true || options.length === 0;
      const chosen = new Set();

      const opts = document.createElement("div");
      opts.className = "opts";
      for (const option of options) {
        const row = document.createElement("label");
        row.className = "opt";
        const input = document.createElement("input");
        input.type = multiple ? "checkbox" : "radio";
        input.name = `q-${id}`;
        input.onchange = () => {
          if (multiple) {
            if (input.checked) chosen.add(option); else chosen.delete(option);
          } else {
            chosen.clear();
            chosen.add(option);
            for (const other of opts.querySelectorAll(".opt")) other.classList.remove("on");
          }
          row.classList.toggle("on", input.checked);
        };
        row.append(input, document.createTextNode(option));
        opts.append(row);
      }
      if (options.length > 0) box.append(opts);

      const free = document.createElement("input");
      free.placeholder = options.length > 0 ? "Or write your own…" : "Your answer";
      if (!allowOther) free.style.display = "none";
      const b = document.createElement("button");
      b.className = "primary";
      b.textContent = "Answer";

      const submit = async () => {
        const typed = free.value.trim();
        // Free text wins when both are given: someone who typed after picking has changed their mind, and the
        // typed value is the more specific of the two.
        const value = typed !== "" ? typed : multiple ? [...chosen] : [...chosen][0];
        if (value === undefined || (Array.isArray(value) && value.length === 0)) return;
        try {
          await gql(`mutation($i: QuestionAnswerInput!){ answerQuestion(input: $i) }`,
            { i: { interactionId: id, runId, answers: { [q.key ?? "answer"]: value } } });
          done(`Answered: ${Array.isArray(value) ? value.join(", ") : value}`);
          $("send").disabled = true;
          void stream(runId, st);
        } catch (e) { note(`Could not send the answer: ${e.message}`, true); }
      };
      b.onclick = submit;
      free.onkeydown = (e) => { if (e.key === "Enter") submit(); };
      box.append(free, b);
      (allowOther && options.length === 0 ? free : b).focus();
    }
  };

  /* ------------------------------------------------------- modes */

  let mode = "ask";
  let modeInfo = {};

  const paintModes = () => {
    const box = $("modes");
    box.innerHTML = "";
    for (const [key, info] of Object.entries(modeInfo)) {
      const b = document.createElement("button");
      b.textContent = info.label;
      b.className = key === mode ? "on" : "";
      b.title = info.summary;
      b.onclick = () => void setMode(key);
      box.append(b);
    }
    $("modehint").textContent = modeInfo[mode]?.summary ?? "";
  };

  const loadMode = async () => {
    try {
      const q = conversationId ? `?conversationId=${encodeURIComponent(conversationId)}` : "";
      const r = await fetch(`/api/mode${q}`, { headers: headers() });
      const j = await r.json();
      mode = j.mode ?? "ask";
      modeInfo = j.modes ?? {};
      paintModes();
    } catch { /* the selector simply stays as it was */ }
  };

  const setMode = async (next) => {
    const previous = mode;
    mode = next;
    // Painted before the request so the click feels immediate; reverted below if the server refuses. A selector
    // that waits for a round trip before showing the change feels broken on a slow connection.
    paintModes();
    try {
      const r = await fetch("/api/mode", {
        method: "POST", headers: headers(),
        body: JSON.stringify({ conversationId: conversationId ?? undefined, mode: next }),
      });
      if (!r.ok) throw new Error((await r.json()).error ?? r.statusText);
      // A plan bar belongs to plan mode. Leaving it by the selector rather than the button means the person
      // chose something else, and a button still offering to execute would run a plan they had moved on from.
      if (next !== "plan") for (const bar of log.querySelectorAll(".planbar")) bar.remove();
      note(next === "auto"
        ? "Auto mode — irreversible actions will no longer pause for approval."
        : next === "plan" ? "Plan mode — the assistant can read and think, but not change anything."
        : "Ask mode — the assistant will pause before anything irreversible.");
    } catch (e) {
      mode = previous;
      paintModes();
      note(`Could not change mode: ${e.message}`, true);
    }
  };

  /* ------------------------------------------------------- conversations */

  const showEmpty = () => {
    log.innerHTML = "";
    const w = wrap();
    w.innerHTML = `<div class="empty"><h2>What can I help with?</h2>
      <p>I keep notes, remember what you tell me, and ask before doing anything irreversible.</p>
      <div class="chips"></div></div>`;
    log.append(w);
    const prompts = [
      "Remember that I work on the platform team.",
      "What's in the notebook?",
      "Compare the two hiring options in note n2 and tell me what you'd do.",
      "Share note n1 externally.",
      "What is 19*37+4?",
    ];
    for (const p of prompts) {
      const b = document.createElement("button");
      b.className = "chip";
      b.textContent = p;
      b.onclick = () => { $("text").value = p; void send(); };
      w.querySelector(".chips").append(b);
    }
  };

  const loadConversations = async () => {
    try {
      const d = await gql(`{ conversations(limit: 30) { items { id title } } }`);
      $("convs").innerHTML = "";
      for (const c of d.conversations.items) {
        const el = document.createElement("div");
        el.className = `conv${c.id === conversationId ? " active" : ""}`;
        el.textContent = c.title || c.id;
        el.title = c.id;
        el.onclick = () => openConversation(c.id);
        $("convs").append(el);
      }
      $("health").className = "dot";
    } catch {
      $("health").className = "dot off";
    }
  };

  /**
   * Reopen a conversation from the durable record.
   *
   * Both roles come from `messages` — the worker records the assistant's turn as of #157, which this app is
   * what found. The server rebuilds the model's history from the same projection, so the page and the model see
   * the same conversation.
   */
  const openConversation = async (id) => {
    conversationId = id;
    log.innerHTML = "";
    seen.clear();
    void loadConversations();
    void loadMode();
    try {
      const r = await fetch(`/api/history?conversationId=${encodeURIComponent(id)}`, { headers: headers() });
      const h = await r.json();
      let last = null;
      for (const t of h.turns ?? []) {
        const b = turn(t.role === "assistant" ? "bot" : "me");
        if (t.role === "assistant") b.innerHTML = `<div class="body">${md(t.text)}</div>`;
        else b.textContent = t.text;
        last = b;
      }
      if (!(h.turns ?? []).length) note("No messages yet.");
      // The server decides whether a plan is pending; the page does not re-derive it. Two answers to "is there
      // a plan?" is one more than the question has.
      if (h.planReady && last) paintPlanBar(last);

      /**
       * A run parked on a question or an approval gets its card back — #163.
       *
       * The card is normally drawn from the live event stream, and that event is long gone by the time someone
       * reopens the tab. Without this, closing the tab on a question left the run in `waiting-for-question`
       * with no way to answer it: parked forever, and nothing on screen to say so.
       */
      if (h.parkedRunId) {
        const st = newTurnState();
        st.bubble = last?.classList.contains("bot") ? last : turn("bot");
        if (h.parkedStatus === "waiting-for-question") await askGate({}, h.parkedRunId, st);
        else await approvalGate(h.parkedRunId, st);
        $("send").disabled = true;
      }
    } catch (e) { note(`Could not open that conversation: ${e.message}`, true); }
  };

  /* ------------------------------------------------------- sending */

  const send = async () => {
    const text = $("text").value.trim();
    if (!text) return;
    $("send").disabled = true;
    $("text").value = "";
    $("text").style.height = "auto";
    if (log.querySelector(".empty")) log.innerHTML = "";
    turn("me").textContent = text;
    try {
      const r = await fetch("/api/message", {
        method: "POST", headers: headers(),
        // The mode travels with the message. On a brand-new chat there is no conversation for `POST /api/mode`
        // to write to, so the selector's choice used to be dropped and the turn ran in the default — Plan shown,
        // `ask` executed. Sending it here means the selector cannot be out of step with the run it starts.
        body: JSON.stringify({ conversationId: conversationId ?? undefined, text, mode }),
      });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error ?? r.statusText);
      const isNew = conversationId !== j.conversationId;
      conversationId = j.conversationId;
      // The server's answer, not the page's assumption.
      if (j.mode && j.mode !== mode) { mode = j.mode; paintModes(); }
      if (isNew) void loadConversations();
      // Subscribe after the run exists. The log is durable and resumes from a sequence, so connecting a moment
      // late loses nothing.
      void stream(j.runId);
    } catch (e) {
      note(`Could not send: ${e.message}`, true);
      $("send").disabled = false;
    }
  };

  $("send").onclick = () => void send();
  $("new").onclick = () => { conversationId = null; seen.clear(); showEmpty(); void loadConversations(); $("text").focus(); };
  $("text").onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); void send(); } };
  $("text").oninput = () => {
    // Grow with the content up to the CSS max-height, so a long message is visible while being written.
    $("text").style.height = "auto";
    $("text").style.height = `${Math.min($("text").scrollHeight, 152)}px`;
  };
  for (const id of ["tenant", "principal", "role"]) {
    $(id).onchange = () => { conversationId = null; seen.clear(); showEmpty(); void loadConversations(); };
  }

  showEmpty();
  void loadConversations();
  void loadMode();
  $("text").focus();
</script>
