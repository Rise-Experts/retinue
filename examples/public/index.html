<!--
  The composer bundle, first. A classic script rather than a module, and deliberately: it runs during parsing,
  which is before any deferred module script, so the global is there by the time the page's own module executes.
  A global rather than an `import` — see the composer section for why a missing bundle must not be a link error.
-->
<script src="/composer.js"></script>
<script type="module">
  const $ = (id) => document.getElementById(id);
  const log = $("log");
  let conversationId = null;
  /**
   * True from sending until the run settles. The send button's state is `empty || sending`, evaluated in one
   * place — before this, `settle` re-enabled the button unconditionally, so it was live over an empty box.
   */
  let sending = false;
  const seen = new Set();

  const headers = () => ({
    "content-type": "application/json",
    // The dev authenticator reads these. This is not authentication — any caller can claim any workspace, which
    // is exactly why the server refuses to start without RETINUE_EXAMPLE_DEV_AUTH=1.
    "x-agentkit-tenant": $("tenant").value.trim(),
    "x-agentkit-principal": $("principal").value.trim(),
    "x-agentkit-roles": $("role").value,
  });

  const gql = async (query, variables = {}) => {
    const r = await fetch("/graphql", { method: "POST", headers: headers(), body: JSON.stringify({ query, variables }) });
    const j = await r.json();
    if (j.errors) throw new Error(j.errors[0].message);
    return j.data;
  };

  /* ------------------------------------------------------- rendering */

  const atBottom = () => log.scrollHeight - log.scrollTop - log.clientHeight < 90;
  const follow = (was) => { if (was) log.scrollTop = log.scrollHeight; };

  const wrap = () => {
    const d = document.createElement("div");
    d.className = "wrap";
    return d;
  };

  const turn = (who) => {
    const was = atBottom();
    const w = wrap();
    const t = document.createElement("div");
    t.className = `turn ${who === "me" ? "me" : "bot"}`;
    const av = document.createElement("div");
    av.className = `av ${who === "me" ? "me" : "bot"}`;
    av.textContent = who === "me" ? ($("principal").value.trim()[0] || "?").toUpperCase() : "✦";
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    t.append(av, bubble);
    w.append(t);
    log.append(w);
    follow(was);
    return bubble;
  };

  const note = (text, bad = false) => {
    const was = atBottom();
    const w = wrap();
    const d = document.createElement("div");
    d.className = `note${bad ? " bad" : ""}`;
    d.textContent = text;
    w.append(d);
    log.append(w);
    follow(was);
    // Returned so a caller can mark it — a mode note replaces the previous one, and needs a handle to find it by.
    return d;
  };

  /**
   * A deliberately small Markdown renderer.
   *
   * Escapes first, then applies a fixed set of patterns — so model output cannot inject HTML. Pulling in a
   * Markdown library would mean a build step, and pulling one from a CDN would mean the page no longer works
   * offline; neither is worth it for headings, lists, code, tables and emphasis.
   */
  const md = (src) => {
    const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
    /**
     * Flatten the LaTeX models emit for arithmetic.
     *
     * `gpt-4o` answers "19*37+4" as `\(19 \times 37 + 4\)`, which rendered literally — backslashes, parens and
     * all. Rendering real maths would mean KaTeX and a build step; for a chat surface, unwrapping the delimiters
     * and mapping the handful of operators that actually show up reads correctly and costs nothing.
     *
     * Applied before escaping so the replacements are on the raw text, and deliberately narrow: an unrecognised
     * command is left alone rather than mangled.
     */
    const delatex = (s) =>
      s
        .replace(/\\[()[\]]/g, "")
        .replace(/\$\$?([^$]+)\$\$?/g, "$1")
        .replace(/\\times/g, "×")
        .replace(/\\div/g, "÷")
        .replace(/\\cdot/g, "·")
        .replace(/\\pm/g, "±")
        .replace(/\\leq/g, "≤")
        .replace(/\\geq/g, "≥")
        .replace(/\\neq/g, "≠")
        .replace(/\\approx/g, "≈")
        .replace(/\\text\{([^}]*)\}/g, "$1")
        .replace(/\\frac\{([^}]*)\}\{([^}]*)\}/g, "$1/$2");

    const inline = (s) =>
      esc(delatex(s))
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        .replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<em>$2</em>")
        // Bare URLs only — a `[text](url)` form would need care about `javascript:`, and models rarely emit one
        // here. Restricted to http(s) for the same reason.
        .replace(/\bhttps?:\/\/[^\s<)]+/g, (u) => `<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`);

    const out = [];
    const lines = src.split("\n");
    let i = 0;
    while (i < lines.length) {
      const line = lines[i];
      if (/^```/.test(line)) {
        const body = [];
        i += 1;
        while (i < lines.length && !/^```/.test(lines[i])) body.push(lines[i++]);
        i += 1;
        out.push(`<pre><code>${esc(body.join("\n"))}</code></pre>`);
        continue;
      }
      const h = /^(#{1,4})\s+(.*)$/.exec(line);
      if (h) { out.push(`<h3>${inline(h[2])}</h3>`); i += 1; continue; }
      if (/^\s*[-*]\s+/.test(line)) {
        const items = [];
        while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) items.push(inline(lines[i++].replace(/^\s*[-*]\s+/, "")));
        out.push(`<ul>${items.map((t) => `<li>${t}</li>`).join("")}</ul>`);
        continue;
      }
      if (/^\s*\d+[.)]\s+/.test(line)) {
        const items = [];
        while (i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])) items.push(inline(lines[i++].replace(/^\s*\d+[.)]\s+/, "")));
        out.push(`<ol>${items.map((t) => `<li>${t}</li>`).join("")}</ol>`);
        continue;
      }
      if (/^\s*\|.*\|\s*$/.test(line)) {
        const rows = [];
        while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) rows.push(lines[i++]);
        const cells = (r) => r.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
        const head = cells(rows[0]);
        const body = rows.slice(/^[\s|:-]+$/.test(rows[1] ?? "") ? 2 : 1);
        out.push(
          `<table><thead><tr>${head.map((c) => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>` +
            body.map((r) => `<tr>${cells(r).map((c) => `<td>${inline(c)}</td>`).join("")}</tr>`).join("") +
            `</tbody></table>`,
        );
        continue;
      }
      if (/^\s*>\s?/.test(line)) { out.push(`<blockquote>${inline(line.replace(/^\s*>\s?/, ""))}</blockquote>`); i += 1; continue; }
      if (line.trim() === "") { i += 1; continue; }
      const para = [];
      while (i < lines.length && lines[i].trim() !== "" && !/^(```|#{1,4}\s|\s*[-*]\s|\s*\d+[.)]\s|\s*\||\s*>)/.test(lines[i]))
        para.push(lines[i++]);
      out.push(`<p>${inline(para.join("\n")).replace(/\n/g, "<br>")}</p>`);
    }
    return out.join("");
  };

  /* ------------------------------------------------------- the stream */

  /** One assistant turn's live state: its bubble, its collapsed tool trace, and the text so far. */
  const newTurnState = () => ({ bubble: null, trace: null, steps: null, text: "", cites: [] });

  const traceFor = (st) => {
    if (st.trace) return st.trace;
    const d = document.createElement("details");
    d.className = "trace";
    const s = document.createElement("summary");
    s.textContent = "tools";
    const ol = document.createElement("ol");
    d.append(s, ol);
    st.bubble.append(d);
    st.trace = d;
    st.steps = ol;
    return d;
  };
  const step = (st, text, cls = "") => {
    traceFor(st);
    const li = document.createElement("li");
    li.className = cls;
    li.textContent = text;
    st.steps.append(li);
    st.trace.querySelector("summary").textContent =
      `tools — ${st.steps.children.length} call${st.steps.children.length === 1 ? "" : "s"}`;
  };

  /**
   * The citation list under an answer.
   *
   * The excerpt is the evidence and it is stored on the part, so a citation is readable even when its source is
   * gone — which is exactly when someone needs it. A retrieval citation has no URL a browser can follow, so it
   * renders as a passage with its source named rather than as a dead link.
   */
  const paintCites = (st) => {
    const was = atBottom();
    st.bubble.querySelector(".cites")?.remove();
    const box = document.createElement("div");
    box.className = "cites";
    const h = document.createElement("div");
    h.className = "cites-h";
    h.textContent = st.cites.length === 1 ? "1 source" : `${st.cites.length} sources`;
    box.append(h);
    st.cites.forEach((part, i) => {
      const row = document.createElement("div");
      row.className = "cite";
      const n = document.createElement("span");
      n.className = "cite-n";
      // 1-based: it is a footnote number a person reads, not an array index.
      n.textContent = String(i + 1);
      const body = document.createElement("div");
      const label = document.createElement("div");
      label.className = "cite-src";
      const origin = part.origin ?? {};
      label.textContent = origin.kind === "web"
        ? (origin.title ?? origin.url ?? "web")
        : `${origin.locator ?? origin.sourceId ?? "source"} · passage ${Number(origin.chunkIndex ?? 0) + 1}`;
      const quote = document.createElement("div");
      quote.className = "cite-q";
      quote.textContent = part.excerpt ?? "";
      body.append(label, quote);
      row.append(n, body);
      box.append(row);
    });
    st.bubble.append(box);
    follow(was);
  };

  const paint = (st) => {
    const was = atBottom();
    st.bubble.querySelector(".body")?.remove();
    const body = document.createElement("div");
    body.className = "body";
    body.innerHTML = md(st.text) + '<span class="caret"></span>';
    // Before the citation list, so sources stay under the answer however the two interleave in the stream.
    const cites = st.bubble.querySelector(".cites");
    if (cites) st.bubble.insertBefore(body, cites);
    else st.bubble.append(body);
    follow(was);
  };

  const render = (event, st, runId) => {
    const key = `${runId}:${event.sequence ?? Math.random()}`;
    // The stream is resumable, so a frame can arrive twice. Deduping on sequence stops a reconnect doubling the
    // reply.
    if (seen.has(key)) return;
    seen.add(key);
    const type = event.type ?? "";

    if (type === "part.added" || type === "part.updated") {
      const part = event.part ?? {};
      if (part.type === "text") {
        if (!st.bubble) st.bubble = turn("bot");
        st.text = part.text ?? "";
        paint(st);
      }
      /**
       * A citation, appended below the answer — #155 AC-5.
       *
       * **Appended, never inserted.** The engine emits citations after the text they ground, and this appends in
       * arrival order, so the markup for N citations is a prefix of the markup for N+1 and nothing already on
       * screen moves. That property is the whole reason the numbering is arrival-order rather than positional.
       */
      if (part.type === "citation") {
        if (!st.bubble) st.bubble = turn("bot");
        st.cites = st.cites ?? [];
        st.cites.push(part);
        paintCites(st);
      }
      return;
    }
    if (!st.bubble) st.bubble = turn("bot");
    if (type === "tool.started") step(st, `→ ${event.toolName ?? "tool"}`);
    else if (type === "tool.completed") step(st, `✓ ${event.toolName ?? "tool"}`, "good");
    else if (type === "tool.failed") step(st, `✗ ${event.toolName ?? "tool"} — ${event.error?.message ?? "failed"}`, "bad");
    else if (type === "approval.requested") void approvalGate(runId, st, event);
    else if (type === "question.requested") void askUser(event, runId, st);
    else if (type === "run.failed") note(`The run failed: ${event.error?.message ?? "unknown error"}`, true);
  };

  const settle = (st) => {
    st.bubble?.querySelector(".caret")?.remove();
    sending = false;
    $("send").disabled = composer.text() === "";
    composer.focus();
    // The window only changes when the conversation does, so this is where to refresh rather than on a timer.
    void loadContext();
    /**
     * A reply that settles in plan mode *is* a plan, so this is where the button belongs.
     *
     * Attached to the bubble rather than floated somewhere global: a plan two turns up is not the plan being
     * offered, and a button that outlives its plan would run the wrong one. `paintPlanBar` clears the old one.
     */
    if (mode === "plan" && st.bubble && st.text) paintPlanBar(st.bubble);
  };

  /**
   * The "Execute plan" bar.
   *
   * Only ever one, under the newest plan. It is removed on the way in rather than tracked, because the states
   * that can put one on screen — a plan settling, and reopening a conversation whose last turn was a plan — do
   * not otherwise know about each other.
   */
  const paintPlanBar = (bubble) => {
    for (const old of log.querySelectorAll(".planbar")) old.remove();
    const bar = document.createElement("div");
    bar.className = "planbar";
    bar.innerHTML = `<span>Plan ready. Executing it leaves plan mode and asks before anything irreversible.</span>`;
    const go = document.createElement("button");
    go.textContent = "Execute plan";
    go.onclick = () => void executePlan(bar);
    bar.append(go);
    bubble.append(bar);
    bubble.scrollIntoView({ block: "end", behavior: "smooth" });
  };

  const executePlan = async (bar) => {
    const button = bar.querySelector("button");
    button.disabled = true;
    button.textContent = "Executing…";
    try {
      const r = await fetch("/api/plan/execute", {
        method: "POST", headers: headers(),
        body: JSON.stringify({ conversationId }),
      });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error ?? r.statusText);
      bar.remove();
      // The server sent a real user message on the person's behalf, so the transcript shows one. Reading the
      // text back from the response rather than repeating it here keeps the two from drifting apart.
      mode = j.mode;
      paintModes();
      turn("me").textContent = j.text;
      $("send").disabled = true;
      note(`Executing the plan in ${j.mode} mode.`);
      void stream(j.runId);
    } catch (e) {
      button.disabled = false;
      button.textContent = "Execute plan";
      note(`Could not execute the plan: ${e.message}`, true);
    }
  };

  /**
   * Read the SSE stream with `fetch`, not `EventSource`.
   *
   * `EventSource` cannot set request headers, and the dev authenticator reads the workspace from one — so an
   * EventSource connection could never be authenticated. Reading the body as a stream is the only shape that
   * carries headers.
   */
  /**
   * Runs with a reader already attached.
   *
   * The SSE connection survives a pause: the server keeps the stream open while the run waits for an approval
   * or an answer, so when it resumes the *existing* reader receives the rest. Opening a second one after
   * answering produced a reader whose every frame was deduped away by `seen` — silent, and its bubble stayed
   * empty while the reply appeared somewhere else.
   */
  const live = new Set();

  const stream = async (runId, st = newTurnState()) => {
    live.add(runId);
    try {
      return await readStream(runId, st);
    } finally {
      live.delete(runId);
    }
  };

  const readStream = async (runId, st) => {
    const r = await fetch(
      `/runs/events?runId=${encodeURIComponent(runId)}&conversationId=${encodeURIComponent(conversationId)}`,
      { headers: { ...headers(), accept: "text/event-stream" } },
    );
    if (!r.ok) { note(`Could not open the stream (${r.status}).`, true); settle(st); return; }
    const reader = r.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      // Frames are separated by a blank line. Splitting per line would reassemble a multi-line `data:` wrongly.
      const frames = buffer.split("\n\n");
      buffer = frames.pop() ?? "";
      for (const frame of frames) {
        const data = frame.split("\n").filter((l) => l.startsWith("data:")).map((l) => l.slice(5).trim()).join("");
        if (!data) continue;
        try {
          /**
           * The frame is a **GraphQL-SSE envelope**, not a bare event.
           *
           * `graphql-sse` sends `{"data":{"runEvents":{…}}}` — the subscription field name is part of the payload.
           * Reading `JSON.parse(data)` as the event directly gave `type: undefined` for every frame, so 58 frames
           * arrived and none rendered: it looked exactly like no streaming at all, which is how this hid behind a
           * real streaming bug.
           *
           * Unwrapped tolerantly rather than assuming the envelope, since the route also accepts an `EventSource`
           * caller that would see a different shape.
           */
          const frame = JSON.parse(data);
          const event = frame?.data?.runEvents ?? frame?.runEvents ?? frame;
          render(event, st, runId);
        } catch { /* keep-alive or partial frame */ }
      }
    }
    settle(st);
  };

  /* ------------------------------------------------------- gates */

  /**
   * The question's own text and options, fetched before the picker is drawn — #163.
   *
   * `question.requested` carries only an `interactionId`; events are thin on purpose. This page used to read
   * `event.questions`, which was never there, so the card rendered as a bare "Your answer" box with no prompt
   * and no options — the picker looked built and was unusable. `pendingQuestion` is the platform query that
   * closes that gap.
   */
  /**
   * The question panel — one question at a time, above the input, submitted together.
   *
   * Above the composer rather than in the transcript: a card in the message flow scrolls away while you read
   * back through what you were told, and a run parked on a question nobody can find stays parked.
   *
   * One question shown at a time with a tab per question, because a wall of six pickers is a form, and a form
   * is answered by skimming. Nothing is sent until Submit: the answers go in **one** `answerQuestion` call, so
   * the run resumes once with everything, and moving between tabs costs nothing and commits nothing.
   *
   * `askUser` collects; `submitAnswers` sends. Answers live in a plain object keyed by the spec's `key`, which
   * is the same shape the platform stores — so there is no mapping step to get wrong.
   */
  let asking = null;

  const askUser = async (event, runId, st = null) => {
    let questions = [];
    let interactionId = event.interactionId;
    try {
      const data = await gql(
        `query($r: ID!){ pendingQuestion(runId: $r){ interactionId questions{ key prompt options multiple allowOther } } }`,
        { r: runId },
      );
      questions = data?.pendingQuestion?.questions ?? [];
      // On the reopen path there is no event to take the id from, so the query is the only source.
      if (data?.pendingQuestion?.interactionId) interactionId = data.pendingQuestion.interactionId;
    } catch (e) {
      note(`Could not read the question: ${e.message}`, true);
    }
    // Nothing answerable: better to say so than to draw a panel that cannot resume the run.
    if (!interactionId || questions.length === 0) {
      note("The assistant asked something the page could not read. The run is waiting.", true);
      return;
    }
    /**
     * The live reader's state is kept, so submitting can end its bubble.
     *
     * A run that pauses and resumes is two stretches of assistant activity with the person's answer between
     * them, and the transcript should read that way. The SSE connection survives the pause, so without this the
     * reader keeps painting into the bubble it already had — and the answer bubble ended up below a reply it
     * had caused. Clearing `st.bubble` on submit makes the next event open a fresh one underneath.
     *
     * Null on the reopen path: there is no live reader then.
     */
    asking = { interactionId, runId, questions, at: 0, answers: {}, other: {}, st: st ?? null };
    paintAsk();
  };

  const closeAsk = () => {
    asking = null;
    const box = $("ask");
    box.hidden = true;
    box.innerHTML = "";
  };

  /** True when this question has something to send. Free text counts; an empty selection does not. */
  const answeredAt = (i) => {
    const q = asking.questions[i];
    const picked = asking.answers[q.key];
    if (Array.isArray(picked) && picked.length > 0) return true;
    if (typeof picked === "string" && picked !== "") return true;
    return String(asking.other[q.key] ?? "").trim() !== "";
  };

  const paintAsk = () => {
    const box = $("ask");
    if (asking === null) return closeAsk();
    box.hidden = false;
    box.innerHTML = "";
    const q = asking.questions[asking.at];
    const many = asking.questions.length > 1;

    if (many) {
      const tabs = document.createElement("div");
      tabs.className = "tabs";
      asking.questions.forEach((spec, i) => {
        const t = document.createElement("button");
        t.className = `tab${i === asking.at ? " on" : ""}${answeredAt(i) ? " done" : ""}`;
        // Numbered, with the prompt as the tooltip: a tab wide enough for a whole question is not a tab.
        t.textContent = `${i + 1}. ${spec.prompt.replace(/\?$/, "").slice(0, 22)}${spec.prompt.length > 23 ? "…" : ""}`;
        t.title = spec.prompt;
        t.onclick = () => { asking.at = i; paintAsk(); };
        tabs.append(t);
      });
      box.append(tabs);
    }

    const prompt = document.createElement("p");
    prompt.className = "q";
    prompt.textContent = q.prompt;
    box.append(prompt);

    const options = Array.isArray(q.options) ? q.options : [];
    if (options.length > 0) {
      const opts = document.createElement("div");
      opts.className = "opts";
      for (const option of options) {
        const row = document.createElement("label");
        row.className = "opt";
        const input = document.createElement("input");
        input.type = q.multiple ? "checkbox" : "radio";
        input.name = `ask-${asking.interactionId}-${q.key}`;
        const current = asking.answers[q.key];
        input.checked = q.multiple
          ? Array.isArray(current) && current.includes(option)
          : current === option;
        input.onchange = () => {
          if (q.multiple) {
            const set = new Set(Array.isArray(asking.answers[q.key]) ? asking.answers[q.key] : []);
            if (input.checked) set.add(option); else set.delete(option);
            asking.answers[q.key] = [...set];
          } else {
            asking.answers[q.key] = input.checked ? option : undefined;
          }
          // Repainted so the tab's answered state and the Submit button follow the selection immediately.
          paintAsk();
        };
        const label = document.createElement("span");
        label.textContent = option;
        row.append(input, label);
        opts.append(row);
      }
      box.append(opts);
    }

    if (q.allowOther || options.length === 0) {
      const other = document.createElement("input");
      other.className = "other";
      other.placeholder = options.length > 0 ? "Or write your own…" : "Your answer";
      other.value = asking.other[q.key] ?? "";
      other.oninput = () => { asking.other[q.key] = other.value; paintTabsOnly(); };
      // Enter moves on rather than submitting: the last question's Enter would otherwise send a form the
      // person had not finished looking at.
      other.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); next(); } };
      box.append(other);
      if (asking.at === 0 || document.activeElement === document.body) setTimeout(() => other.focus(), 0);
    }

    const row = document.createElement("div");
    row.className = "row";
    const back = document.createElement("button");
    back.className = "nav";
    back.textContent = "Back";
    back.disabled = asking.at === 0;
    back.onclick = () => { asking.at -= 1; paintAsk(); };

    const forward = document.createElement("button");
    forward.className = "nav";
    forward.textContent = "Next";
    forward.disabled = asking.at >= asking.questions.length - 1;
    forward.onclick = next;

    const count = document.createElement("span");
    count.className = "count";
    const answered = asking.questions.filter((_, i) => answeredAt(i)).length;
    count.textContent = many ? `${answered} of ${asking.questions.length} answered` : "";

    const submit = document.createElement("button");
    submit.className = "submit";
    submit.textContent = "Submit";
    // Every question, not just the one on screen. A partial submit resumes the run with holes in it, and the
    // model then asks again for the parts it did not get.
    submit.disabled = answered < asking.questions.length;
    submit.title = submit.disabled ? "Answer every question first" : "Send all answers";
    submit.onclick = () => void submitAnswers();

    if (many) row.append(back, forward);
    row.append(count);
    const spacer = document.createElement("span");
    spacer.className = "spacer";
    row.append(spacer, submit);
    box.append(row);
  };

  /** Repaint just the tabs and the footer, so typing in the free-text box does not steal its own focus. */
  const paintTabsOnly = () => {
    const box = $("ask");
    if (asking === null) return;
    const many = asking.questions.length > 1;
    const answered = asking.questions.filter((_, i) => answeredAt(i)).length;
    box.querySelectorAll(".tab").forEach((t, i) => t.classList.toggle("done", answeredAt(i)));
    const count = box.querySelector(".count");
    if (count) count.textContent = many ? `${answered} of ${asking.questions.length} answered` : "";
    const submit = box.querySelector("button.submit");
    if (submit) submit.disabled = answered < asking.questions.length;
  };

  const next = () => {
    if (asking === null) return;
    if (asking.at < asking.questions.length - 1) { asking.at += 1; paintAsk(); }
  };

  const submitAnswers = async () => {
    if (asking === null) return;
    const { interactionId, runId, questions } = asking;
    const answers = {};
    for (const q of questions) {
      const free = String(asking.other[q.key] ?? "").trim();
      const picked = asking.answers[q.key];
      if (q.multiple) {
        // Free text joins the chosen options rather than replacing them — with `multiple`, "these two and
        // also this" is a coherent answer, and dropping either half would be answering something else.
        const list = [...(Array.isArray(picked) ? picked : []), ...(free === "" ? [] : [free])];
        answers[q.key] = list;
      } else {
        // Single-select: free text wins when both are given. The person typed it after clicking, and the
        // typing is the more specific act.
        answers[q.key] = free !== "" ? free : (typeof picked === "string" ? picked : "");
      }
    }
    const box = $("ask");
    box.querySelectorAll("button").forEach((b) => { b.disabled = true; });

    try {
      await gql(`mutation($i: QuestionAnswerInput!){ answerQuestion(input: $i) }`,
        { i: { interactionId, runId, answers } });
      // Shown in the transcript as what it is: the person's turn. Closing the panel without a trace would
      // leave no record of what was chosen once the run moved on.
      const summary = questions
        .map((q) => `${q.prompt} — ${Array.isArray(answers[q.key]) ? answers[q.key].join(", ") : answers[q.key]}`)
        .join("\n");
      // The reply so far is finished: drop its caret and end the bubble, so what comes after the answer opens
      // a new one below it rather than continuing the one that asked.
      if (asking.st) {
        asking.st.bubble?.querySelector(".caret")?.remove();
        asking.st.bubble = null;
        asking.st.trace = null;
        asking.st.steps = null;
        asking.st.text = "";
      }
      turn("me").textContent = summary;
      closeAsk();
      $("send").disabled = true;
      // Only when nothing is already reading this run. The connection survives the pause, so a second reader
      // would be deduped into silence by `seen` and its own bubble would never receive anything.
      if (!live.has(runId)) void stream(runId);
    } catch (e) {
      note(`Could not send the answers: ${e.message}`, true);
      paintAsk();
    }
  };

  /**
   * The approval's summary and tool name, fetched before the card is drawn — #163.
   *
   * `approval.requested` carries only an `interactionId` too, so this card fell back to "Run a tool? This
   * cannot be undone." — asking someone to authorise an action it could not name. `pendingApproval` is the
   * query that fixes it.
   */
  const approvalGate = async (runId, st, event = {}) => {
    let detail = null;
    try {
      const data = await gql(
        `query($r: ID!){ pendingApproval(runId: $r){ interactionId toolName summary riskCategory } }`,
        { r: runId },
      );
      detail = data?.pendingApproval ?? null;
    } catch (e) {
      note(`Could not read the approval: ${e.message}`, true);
    }
    // Already decided, or gone: nothing to ask. Drawing an undecidable card would be worse than none.
    if (detail === null && !event.interactionId) return;
    gate({ ...event, ...(detail ?? {}) }, runId, "approval", st);
  };

  /**
   * The approval card — **approvals only**.
   *
   * It used to render questions too, in the message flow. Questions moved to the panel above the composer,
   * which is a different interaction: an approval is one decision about one act and belongs beside the act in
   * the transcript, where a question is a form the person fills in before the conversation continues.
   */
  const gate = (event, runId, kind, st) => {
    const id = event.interactionId;
    if (!id) return;
    const box = document.createElement("div");
    box.className = "gate";
    const h = document.createElement("h4");
    h.textContent = "Approval needed";
    const d = document.createElement("div");
    d.className = "d";
    // The summary comes from `pendingApproval` now, so this names the actual act rather than "a tool" (#163).
    d.textContent = (event.summary ?? `Run ${event.toolName ?? "a tool"}?`) + " This cannot be undone.";
    box.append(h, d);
    st.bubble.append(box);
    const done = (label) => { box.innerHTML = `<h4>${label}</h4>`; };

    {
      for (const [label, decision, primary] of [["Approve", "allow-once", true], ["Deny", "deny", false]]) {
        const b = document.createElement("button");
        if (primary) b.className = "primary";
        b.textContent = label;
        b.onclick = async () => {
          try {
            // The platform's own mutation. The run resumes because `decideApproval` transitions it back to
            // `queued` and re-enqueues — and because the queue now clears the finished job holding that id (#156).
            await gql(`mutation($i: ApprovalDecisionInput!){ decideApproval(input: $i) }`,
              { i: { interactionId: id, runId, decision } });
            done(label === "Approve" ? "Approved" : "Denied");
            $("send").disabled = true;
            // Same guard as the answer path: the reader that was open when the run parked is still open, and a
            // second one would have every frame deduped away.
            if (!live.has(runId)) void stream(runId, st);
          } catch (e) { note(`Could not record the decision: ${e.message}`, true); }
        };
        box.append(b);
      }
    }
  };

  /* ------------------------------------------------------- context window */

  /**
   * How full the window is — #167.
   *
   * Refreshed after each turn rather than polled, because it only changes when the conversation does. The server
   * supplies the threshold as well as the fraction, so the meter cannot say "fine" while the server compacts.
   *
   * Tokens shown as an estimate, and labelled as one: the platform's counter is ~4 characters per token, not the
   * provider's tokenizer. Rounding to thousands is deliberate — a figure like "12,431 tokens" claims a precision
   * this does not have.
   */
  const loadContext = async () => {
    if (!conversationId) { $("ctxmeter").hidden = true; return; }
    try {
      const r = await fetch(`/api/context?conversationId=${encodeURIComponent(conversationId)}`, { headers: headers() });
      if (!r.ok) return;
      const c = await r.json();
      const meter = $("ctxmeter");
      meter.hidden = false;
      meter.classList.toggle("warn", c.fraction >= c.compactAt);
      // Both, because the ring and the figure are no longer in the same element — see `.metaz.warn #ctxtext`.
      $("metaz").classList.toggle("warn", c.fraction >= c.compactAt);
      /**
       * The ring's arc, as a dash.
       *
       * `r=7`, so the circumference is 2π·7 ≈ 43.98. The dash is that times the fraction and the gap is the rest,
       * which is why a full window closes the circle exactly rather than approximately.
       *
       * `Math.min(1, …)` because the fraction can exceed one: the estimate is ~4 characters per token, and a
       * conversation over its window would otherwise draw a second lap over the first.
       */
      const circumference = 2 * Math.PI * 7;
      const filled = Math.min(1, Math.max(0, c.fraction)) * circumference;
      $("ctxfill").setAttribute("stroke-dasharray", `${filled.toFixed(2)} ${(circumference - filled).toFixed(2)}`);
      const k = (n) => (n >= 1000 ? `${Math.round(n / 1000)}k` : String(n));
      $("ctxtext").textContent = `~${k(c.usedTokens)} / ${k(c.limit)} context`;
      meter.title =
        `Estimated ${c.usedTokens} of ${c.limit} tokens: ${c.promptTokens} prompt, ${c.historyTokens} history ` +
        `over ${c.turns} turns. Compacts automatically at ${Math.round(c.compactAt * 100)}%.`;
      // The ring carries no text, so the percentage has to be said somewhere a screen reader will reach.
      meter.setAttribute("aria-label", `Context window ${Math.round(c.fraction * 100)}% full`);
    } catch { /* the meter is not worth an error message */ }
  };

  /**
   * `/compact` — condense the history now.
   *
   * A person compacts when they have finished with a topic, which is a better moment than any threshold can
   * see. The automatic trigger still exists for the conversation nobody is watching.
   */
  const compactNow = async () => {
    note("Condensing the earlier history…");
    try {
      const r = await fetch("/api/compact", {
        method: "POST", headers: headers(),
        body: JSON.stringify({ conversationId }),
      });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error ?? r.statusText);
      // Reported as what happened, including "nothing to do". A person who pressed it on a short conversation
      // has not done anything wrong, and an error would suggest they had.
      // `plural` because the real numbers are often 1: "Condensed 1 parts ... 12 recent turns" was on screen
      // the first time this ran through the command menu.
      const plural = (n, one, many) => `${n.toLocaleString()} ${n === 1 ? one : many}`;
      note(
        j.compacted
          ? `Condensed ${plural(j.droppedParts, "part", "parts")} into a summary — about ` +
            `${plural(j.tokensReclaimed, "token", "tokens")} reclaimed, ` +
            `${plural(j.keptTurns, "recent turn", "recent turns")} kept as they are.`
          : j.reason === "too-short"
            ? "Nothing to condense yet — the conversation is still short."
            : "Nothing to condense: the earlier turns are all tool activity still in use.",
      );
      void loadContext();
    } catch (e) {
      note(`Could not condense the history: ${e.message}`, true);
    }
  };

  /* ------------------------------------------------------- usage panel */

  /**
   * The usage panel — #155 AC-5.
   *
   * **All four states are drawn, and the server decides which.** `loading`, `empty`, `loaded` and `error` are a
   * closed union in `shapeUsagePanel`, and each is a different thing to say: `empty` means the range genuinely
   * had no usage, and drawing a zeroed chart for it is what the empty state exists to avoid; `error` means a
   * failed refresh, and a spinner for that hides the failure behind an animation that never ends.
   *
   * Nothing is computed here — no totals summed, no fractions derived, no minor units divided by 100. The
   * server hands over `panel` and `formatted`, so there is exactly one implementation of the panel's rules.
   */
  const loadUsage = async () => {
    const body = $("usage-body");
    body.innerHTML = '<div class="usage-empty">Loading…</div>';
    try {
      const r = await fetch("/api/usage", { headers: headers() });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error ?? r.statusText);
      paintUsage(j.panel, j.formatted);
      // Limits after the spend, in the same panel: "what has this cost" and "what is left" are one question
      // asked in two halves, and answering them in different places is how people find one and not the other.
      await paintLimits();
    } catch (e) {
      body.innerHTML = "";
      const d = document.createElement("div");
      d.className = "usage-err";
      d.textContent = `Could not load usage: ${e.message}`;
      body.append(d);
    }
  };

  /**
   * Every limit in force, most constraining first — #183.
   *
   * From `GET /api/limits`, which asks the quota guard rather than reading rows: the figures a person sees are
   * the same ones enforcement used, computed by the same code. A panel with its own idea of "how full is it"
   * eventually shows somebody a comfortable number while they are being refused.
   *
   * Server order is preserved deliberately — it is shortest-span-first, so the limit that will stop you soonest
   * is at the top. Re-sorting here would be a second opinion about which limit matters.
   */
  const paintLimits = async () => {
    const body = $("usage-body");
    try {
      const r = await fetch("/api/limits", { headers: headers() });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error ?? r.statusText);

      const head = document.createElement("div");
      head.className = "usage-h";
      head.textContent = "Limits";
      body.append(head);

      if (j.unbounded) {
        const d = document.createElement("div");
        d.className = "usage-empty";
        // Said, not left blank. An empty area also means "the request failed", and the difference matters when
        // the question is whether you are about to be cut off.
        d.textContent = "No limits configured — unbounded.";
        body.append(d);
        return;
      }

      for (const limit of j.applying) {
        for (const dim of limit.dimensions) {
          const row = document.createElement("div");
          row.className = "limit";
          const label = document.createElement("div");
          label.className = "limit-label";
          // Whose it is, then what it covers. "You" versus "Workspace" is the same distinction the refusal
          // messages make, so the panel and the refusal describe a limit the same way.
          label.textContent =
            `${limit.scope === "personal" ? "You" : "Workspace"} · ${dim.dimension} · ${limit.window}` +
            (limit.modelId ? ` · ${limit.modelId}` : "");
          const track = document.createElement("div");
          track.className = "limit-track";
          const fill = document.createElement("span");
          // Clamped: a fraction over one would otherwise render as a bar wider than its track.
          fill.style.width = `${Math.min(100, Math.round(dim.fraction * 100))}%`;
          if (dim.fraction >= 1) track.classList.add("over");
          else if (dim.fraction >= 0.8) track.classList.add("warn");
          track.append(fill);
          const figures = document.createElement("div");
          figures.className = "limit-figures";
          figures.textContent = `${dim.used.toLocaleString()} / ${dim.limit.toLocaleString()}`;
          // The reset in the tooltip rather than the row: it is the thing you want once, after you have seen
          // that the bar is full.
          row.title = limit.resetNote || `Resets at ${limit.resetsAt}`;
          row.append(label, track, figures);
          body.append(row);
        }
      }
    } catch (e) {
      const d = document.createElement("div");
      d.className = "usage-err";
      d.textContent = `Could not load limits: ${e.message}`;
      body.append(d);
    }
  };

  const paintUsage = (panel, formatted) => {
    const body = $("usage-body");
    body.innerHTML = "";
    if (panel.state === "empty") {
      const d = document.createElement("div");
      d.className = "usage-empty";
      // Said in words. A chart of zeroes looks like a broken chart, and "nothing yet" is not the same claim.
      d.textContent = "No usage recorded in the last 7 days.";
      body.append(d);
      return;
    }

    const totals = document.createElement("dl");
    totals.className = "usage-tot";
    for (const [label, value] of [
      ["Cost", formatted.cost],
      ["Input", formatted.inputTokens],
      ["Output", formatted.outputTokens],
      ["Runs", String(panel.totals.eventCount)],
    ]) {
      const dt = document.createElement("dt");
      dt.textContent = label;
      const dd = document.createElement("dd");
      dd.textContent = value;
      totals.append(dt, dd);
    }
    body.append(totals);

    if (panel.bars.length > 0) {
      const bars = document.createElement("div");
      bars.className = "usage-bars";
      bars.setAttribute("role", "img");
      // Labelled as a whole rather than bar by bar: 7 announcements of "0%" is worse than one summary.
      bars.setAttribute("aria-label", `Daily cost, ${panel.bars.length} days, total ${formatted.cost}`);
      panel.bars.forEach((bar, i) => {
        const el = document.createElement("div");
        el.className = `usage-bar${bar.fraction > 0 ? " on" : ""}`;
        // Against the peak, computed by the server — a quiet day reads as quiet instead of being rescaled.
        el.style.height = `${Math.max(2, Math.round(bar.fraction * 100))}%`;
        el.title = `${bar.bucketStart.slice(0, 10)} · ${formatted.bars[i]?.cost ?? ""}`;
        bars.append(el);
      });
      body.append(bars);
    }

    for (const entry of formatted.byModel) {
      const row = document.createElement("div");
      row.className = "usage-model";
      const k = document.createElement("span");
      k.textContent = entry.key;
      const v = document.createElement("span");
      v.textContent = entry.cost;
      row.append(k, v);
      body.append(row);
    }

    if (panel.quota.status !== "none" && panel.quota.costFraction !== null) {
      const track = document.createElement("div");
      track.className = `usage-quota ${panel.quota.status}`;
      track.setAttribute("role", "progressbar");
      track.setAttribute("aria-valuemin", "0");
      track.setAttribute("aria-valuemax", "100");
      track.setAttribute("aria-valuenow", String(Math.round(panel.quota.costFraction * 100)));
      const fill = document.createElement("span");
      fill.style.width = `${Math.round(panel.quota.costFraction * 100)}%`;
      track.append(fill);
      body.append(track);
    }
  };

  /* ------------------------------------------------------- modes */

  let mode = "ask";
  let modeInfo = {};

  const paintModes = () => {
    const box = $("modes");
    box.innerHTML = "";
    for (const [key, info] of Object.entries(modeInfo)) {
      const b = document.createElement("button");
      b.textContent = info.label;
      b.className = key === mode ? "on" : "";
      b.title = info.summary;
      b.onclick = () => void setMode(key);
      box.append(b);
    }
    $("modehint").textContent = modeInfo[mode]?.summary ?? "";
    paintModeChip();
  };

  /**
   * The same state, on the composer — #179.
   *
   * Painted from `mode` and `modeInfo` like the sidebar, in the same function call, so there is no second source
   * of truth to fall out of step. Both controls call `setMode`; neither owns the mode.
   */
  const paintModeChip = () => {
    const info = modeInfo[mode];
    $("modechiptext").textContent = info?.label ?? mode;
    $("modedot").className = `dot m-${mode}`;
    $("modechip").title = info?.summary ?? "";
    const menu = $("modemenu");
    menu.replaceChildren();
    for (const [key, i] of Object.entries(modeInfo)) {
      const b = document.createElement("button");
      b.type = "button";
      if (key === mode) b.className = "on";
      const label = document.createElement("span");
      label.textContent = i.label;
      const summary = document.createElement("span");
      summary.textContent = i.summary;
      b.append(label, summary);
      b.onmousedown = (e) => { e.preventDefault(); closeModeMenu(); void setMode(key); };
      menu.append(b);
    }
  };

  const closeModeMenu = () => { $("modemenu").hidden = true; $("modechip").setAttribute("aria-expanded", "false"); };

  const loadMode = async () => {
    try {
      const q = conversationId ? `?conversationId=${encodeURIComponent(conversationId)}` : "";
      const r = await fetch(`/api/mode${q}`, { headers: headers() });
      const j = await r.json();
      mode = j.mode ?? "ask";
      modeInfo = j.modes ?? {};
      paintModes();
    } catch { /* the selector simply stays as it was */ }
  };

  const setMode = async (next) => {
    const previous = mode;
    mode = next;
    // Painted before the request so the click feels immediate; reverted below if the server refuses. A selector
    // that waits for a round trip before showing the change feels broken on a slow connection.
    paintModes();
    try {
      const r = await fetch("/api/mode", {
        method: "POST", headers: headers(),
        body: JSON.stringify({ conversationId: conversationId ?? undefined, mode: next }),
      });
      if (!r.ok) throw new Error((await r.json()).error ?? r.statusText);
      // A plan bar belongs to plan mode. Leaving it by the selector rather than the button means the person
      // chose something else, and a button still offering to execute would run a plan they had moved on from.
      if (next !== "plan") for (const bar of log.querySelectorAll(".planbar")) bar.remove();
      /**
       * One mode note at a time — #179.
       *
       * Each switch used to append a permanent line, so flipping between modes while trying something left a
       * column of seven stale notices in the transcript, every one of them describing a mode that was no longer
       * the mode. The current mode is a fact, not an event: the previous note is replaced.
       */
      // The wrapper goes too, not just the note inside it: an emptied wrapper still occupies its own row.
      for (const stale of log.querySelectorAll(".note.mode-note")) (stale.closest(".wrap") ?? stale).remove();
      note(next === "auto"
        ? "Auto mode — irreversible actions will no longer pause for approval."
        : next === "plan" ? "Plan mode — the assistant can read and think, but not change anything."
        : "Ask mode — the assistant will pause before anything irreversible.").classList.add("mode-note");
    } catch (e) {
      mode = previous;
      paintModes();
      note(`Could not change mode: ${e.message}`, true);
    }
  };

  /* ------------------------------------------------------- conversations */

  const showEmpty = () => {
    log.innerHTML = "";
    const w = wrap();
    w.innerHTML = `<div class="empty"><h2>What can I help with?</h2>
      <p>I keep notes, remember what you tell me, and ask before doing anything irreversible.</p>
      <div class="chips"></div></div>`;
    log.append(w);
    const prompts = [
      "Remember that I work on the platform team.",
      "What's in the notebook?",
      "Compare the two hiring options in note n2 and tell me what you'd do.",
      "Share note n1 externally.",
      "What is 19*37+4?",
    ];
    for (const p of prompts) {
      const b = document.createElement("button");
      b.className = "chip";
      b.textContent = p;
      // Through the composer, not `.value` — the input is no longer a textarea, and assigning `.value` to a
      // div is a silent no-op that left these buttons doing nothing at all.
      b.onclick = () => { composer.clear(); composer.insert(p); void send(); };
      w.querySelector(".chips").append(b);
    }
  };

  const loadConversations = async () => {
    try {
      const d = await gql(`{ conversations(limit: 30) { items { id title } } }`);
      $("convs").innerHTML = "";
      for (const c of d.conversations.items) {
        const el = document.createElement("div");
        el.className = `conv${c.id === conversationId ? " active" : ""}`;
        el.textContent = c.title || c.id;
        el.title = c.id;
        el.onclick = () => openConversation(c.id);
        $("convs").append(el);
      }
      $("health").className = "dot";
    } catch {
      $("health").className = "dot off";
    }
  };

  /**
   * Reopen a conversation from the durable record.
   *
   * Both roles come from `messages` — the worker records the assistant's turn as of #157, which this app is
   * what found. The server rebuilds the model's history from the same projection, so the page and the model see
   * the same conversation.
   */
  const openConversation = async (id) => {
    conversationId = id;
    log.innerHTML = "";
    seen.clear();
    // A panel belongs to one run. Left open across a switch it would answer the question of the conversation
    // you just left, and resume a run you are no longer looking at.
    closeAsk();
    void loadConversations();
    void loadMode();
    void loadContext();
    try {
      const r = await fetch(`/api/history?conversationId=${encodeURIComponent(id)}`, { headers: headers() });
      const h = await r.json();
      let last = null;
      for (const t of h.turns ?? []) {
        const b = turn(t.role === "assistant" ? "bot" : "me");
        if (t.role === "assistant") b.innerHTML = `<div class="body">${md(t.text)}</div>`;
        else b.textContent = t.text;
        /**
         * Citations survive a reload, because #157 made the assistant's turn a real row with its parts.
         *
         * The panels come from the server's `citationViewModel` — the same numbering the live stream produced,
         * so a citation is number 3 whether you watched it arrive or opened the conversation a week later.
         */
        if ((t.citations ?? []).length > 0) {
          paintCites({ bubble: b, cites: t.citations });
        }
        last = b;
      }
      if (!(h.turns ?? []).length) note("No messages yet.");
      // The server decides whether a plan is pending; the page does not re-derive it. Two answers to "is there
      // a plan?" is one more than the question has.
      if (h.planReady && last) paintPlanBar(last);

      /**
       * A run parked on a question or an approval gets its card back — #163.
       *
       * The card is normally drawn from the live event stream, and that event is long gone by the time someone
       * reopens the tab. Without this, closing the tab on a question left the run in `waiting-for-question`
       * with no way to answer it: parked forever, and nothing on screen to say so.
       */
      if (h.parkedRunId) {
        const st = newTurnState();
        st.bubble = last?.classList.contains("bot") ? last : turn("bot");
        if (h.parkedStatus === "waiting-for-question") await askUser({}, h.parkedRunId);
        else await approvalGate(h.parkedRunId, st);
        $("send").disabled = true;
      }
    } catch (e) { note(`Could not open that conversation: ${e.message}`, true); }
  };

  /* ------------------------------------------------------- the composer */

  /**
   * The input — #179.
   *
   * The one bundled thing on this page, and the only import it has. Everything about the *platform* is still
   * plain script you can read in this file; the editor is a widget, and a widget with a suggestion menu, a real
   * placeholder and paste handling is 200 lines of caret arithmetic if hand-rolled over `contenteditable`.
   *
   * Reached through a global rather than an `import` deliberately. A missing bundle — someone ran the app without
   * building — makes `import { mount }` a *link* error, which fails this entire module: no chat at all, and a
   * console message about an export. Through a global, the failure is one absent object and this page can say
   * what to run. The server helps by answering `/composer.js` with a script that reports itself missing.
   */
  const composerApi = window.AgentkitComposer;
  const composer = composerApi
    ? composerApi.mount({
        element: $("text"),
        menuElement: $("cmdmenu"),
        placeholder: "Message the assistant, or / for commands…",
        onSubmit: () => void send(),
        // A command chosen from the menu goes through the same function as one typed as text.
        onCommand: (name) => void runCommand(name).then((handled) => {
          if (!handled) note(`No such command: /${name}`, true);
        }),
        onChange: (text) => { $("send").disabled = text === "" || sending; },
      })
    : {
        // Enough of the handle to keep the rest of the page working, so the failure is a dead input with an
        // explanation rather than a blank screen.
        text: () => "", clear() {}, focus() {}, insert() {}, destroy() {},
      };

  // The initial state, which `onChange` cannot give: it fires on a change, and an untouched box has had none —
  // so the button sat enabled over an empty editor until the first keystroke, offering to send nothing.
  $("send").disabled = composer.text() === "";

  /** `+` is a way to reach the menu without knowing to type `/`. It types the slash rather than duplicating the
   *  menu's logic, so there is one path into it. */
  $("cmdopen").onmousedown = (e) => {
    e.preventDefault();
    // Already open: leave it alone. A second slash would make the text `//`, which matches no command, so the
    // button would have closed the menu it is meant to open.
    if (!$("cmdmenu").hidden) { composer.focus(); return; }
    // Types the slash rather than opening the menu itself: the menu opens *because* the text starts with one,
    // which is the same path a keystroke takes. One way for the menu to open, not two.
    composer.insert("/");
  };

  $("modechip").onclick = () => {
    const menu = $("modemenu");
    menu.hidden = !menu.hidden;
    $("modechip").setAttribute("aria-expanded", String(!menu.hidden));
  };
  // Anywhere else closes it. `pointerdown` on the document rather than a blur handler, because the chip's own
  // menu buttons are inside it and a blur would fire before their handlers.
  document.addEventListener("pointerdown", (e) => {
    if (!$("modemenu").hidden && !$("modemenu").contains(e.target) && e.target !== $("modechip")
        && !$("modechip").contains(e.target)) closeModeMenu();
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModeMenu(); });

  /**
   * Dictation, through the browser's own speech recognition.
   *
   * Hidden where there is none rather than shown disabled — a control that is present and never works reads as a
   * broken app, while an absent one reads as a browser difference, which is what it is. Chrome exposes this as
   * `webkitSpeechRecognition`; Firefox has nothing.
   *
   * Interim results are deliberately not inserted. They rewrite themselves as the recogniser changes its mind,
   * and watching your own sentence churn while you speak is worse than waiting for the final one.
   */
  const Recognition = window.SpeechRecognition ?? window.webkitSpeechRecognition;
  if (Recognition && composerApi) {
    const mic = $("mic");
    mic.hidden = false;
    let listening = null;
    mic.onclick = () => {
      if (listening) { listening.stop(); return; }
      const r = new Recognition();
      r.lang = navigator.language || "en-US";
      r.interimResults = false;
      r.continuous = false;
      r.onresult = (event) => {
        const said = [...event.results].map((x) => x[0].transcript).join(" ").trim();
        if (said === "") return;
        // Inserted at the caret through the editor, so it joins whatever was already typed instead of replacing
        // it — dictating a clause into a half-written message is the normal case.
        composer.insert(composer.text() === "" ? said : ` ${said}`);
      };
      r.onerror = (event) => {
        // `no-speech` and `aborted` are ordinary — someone pressed the button and said nothing, or pressed it
        // again. Only report the rest.
        if (event.error !== "no-speech" && event.error !== "aborted") note(`Dictation failed: ${event.error}`, true);
      };
      r.onend = () => { listening = null; mic.classList.remove("mic-on"); };
      listening = r;
      mic.classList.add("mic-on");
      r.start();
    };
  }

  /**
   * What is about to run, beside the input.
   *
   * Read from the server rather than guessed: the model is resolved from configuration the page cannot see, and a
   * label naming a different model than the one answering is worse than no label.
   *
   * The second fact is the **endpoint host**, not a reasoning-effort setting. This app has no effort control and
   * `definitionFor` reports `reasoning: false` unconditionally, so an effort indicator here would have been a
   * label with nothing behind it. Which endpoint answered is real, and it is the thing you actually want to know
   * when a local model and a hosted one are both configured.
   */
  const loadModelMeta = async () => {
    try {
      const r = await fetch("/api/model", { headers: headers() });
      if (!r.ok) return;
      const j = await r.json();
      // Nothing at all when no model is configured, rather than the word "null". The first turn will say so
      // properly; a label is not the place to report a misconfiguration.
      if (!j.id) return;
      $("modelmeta").textContent = j.host ? `${j.id} · ${j.host}` : j.id;
      $("modelmeta").title = j.contextTokens
        ? `${j.id} at ${j.host}, ${j.contextTokens.toLocaleString()}-token window`
        : j.id;
    } catch { /* the label simply stays empty */ }
  };

  /* ------------------------------------------------------- sending */

  /**
   * A slash command, from either way of reaching it — #179.
   *
   * Typed as text and sent, or chosen from the menu: both land here, so the two entry points cannot diverge.
   * These are instructions to the *application*, not messages to the model — sending `/compact` as a turn would
   * have the assistant explain what compaction is while the history kept growing.
   *
   * Returns true when it handled the text, which is how `send` knows not to send it.
   */
  const runCommand = async (name) => {
    if (name === "compact") {
      if (!conversationId) { note("Nothing to condense yet — this conversation has not started."); return true; }
      await compactNow();
      return true;
    }
    if (["auto", "ask", "plan"].includes(name)) {
      await setMode(name);
      return true;
    }
    return false;
  };

  const send = async () => {
    // A second run while one is streaming would queue behind it in the coordinator and arrive with this page
    // already following the first — so it is refused here, where the button is also disabled.
    if (sending) return;
    const text = composer.text();
    if (!text) return;
    if (text.startsWith("/") && !/\s/.test(text)) {
      const handled = await runCommand(text.slice(1));
      // Cleared only once it is known to be a command. An unrecognised `/word` stays in the box and is sent as
      // the message it is, rather than vanishing with nothing happening.
      if (handled) { composer.clear(); return; }
    }
    sending = true;
    $("send").disabled = true;
    composer.clear();
    if (log.querySelector(".empty")) log.innerHTML = "";
    turn("me").textContent = text;
    try {
      const r = await fetch("/api/message", {
        method: "POST", headers: headers(),
        // The mode travels with the message. On a brand-new chat there is no conversation for `POST /api/mode`
        // to write to, so the selector's choice used to be dropped and the turn ran in the default — Plan shown,
        // `ask` executed. Sending it here means the selector cannot be out of step with the run it starts.
        body: JSON.stringify({ conversationId: conversationId ?? undefined, text, mode }),
      });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error ?? r.statusText);
      const isNew = conversationId !== j.conversationId;
      conversationId = j.conversationId;
      // The server's answer, not the page's assumption.
      if (j.mode && j.mode !== mode) { mode = j.mode; paintModes(); }
      if (isNew) void loadConversations();
      // Subscribe after the run exists. The log is durable and resumes from a sequence, so connecting a moment
      // late loses nothing.
      void stream(j.runId);
    } catch (e) {
      note(`Could not send: ${e.message}`, true);
      sending = false;
      $("send").disabled = composer.text() === "";
    }
  };

  $("send").onclick = () => void send();
  // Fetched when opened, and refreshed on each open — usage changes as you use it, and a stale figure in a
  // cost panel is the one kind of stale figure people act on.
  $("usage").ontoggle = () => { if ($("usage").open) void loadUsage(); };

  $("new").onclick = () => { conversationId = null; seen.clear(); closeAsk(); showEmpty(); void loadConversations(); composer.focus(); };
  for (const id of ["tenant", "principal", "role"]) {
    // Identity changed: the parked run belongs to the previous person, and its panel with it.
    $(id).onchange = () => { conversationId = null; seen.clear(); closeAsk(); showEmpty(); void loadConversations(); };
  }

  showEmpty();
  // After `showEmpty`, which replaces the log's contents — reported before it, the explanation was wiped by the
  // empty state a few lines later and the input was simply dead with nothing said.
  if (!composerApi) note("The composer failed to load — run `npm run build -w @retinue/example-app`, then reload.", true);
  void loadConversations();
  void loadMode();
  void loadModelMeta();
  composer.focus();
</script>
