<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Assistant · agentkit</title>
<!--
  A chat assistant over @agentkit (#155).

  No framework, and one bundled file: the composer (#179). Everything about the *platform* — streaming, approvals,
  questions, modes, citations, compaction — is still plain readable script in here, so what you see is the
  runtime's behaviour rather than a bundler's. The exception is the text input, which is Tiptap, because a
  suggestion menu and a real placeholder over `contenteditable` is a few hundred lines of caret arithmetic that
  would tell you nothing about @agentkit. Its source is `src/composer/`, built by `npm run build`.

  This is also the first place the runtime's streaming, approval and question paths are driven by a person at all
  — the frontend components' tests use `renderToStaticMarkup`, so there is no DOM and no clicks, and a handler
  wired to the wrong prop is otherwise undetectable.

  An earlier version of this page was deliberately unstyled, on the theory that a test surface which looks
  designed gets argued about instead of used. That was the wrong call: something you are meant to *use* while
  judging an assistant's answers has to be pleasant enough to read them in.
-->
<style>
  :root {
    --bg:#fbfbfc; --panel:#fff; --fg:#16171a; --muted:#6b6f76; --faint:#9aa0a6;
    --line:#e6e7ea; --accent:#2f6feb; --accent-soft:#eef3fe;
    --me:#2f6feb; --me-fg:#fff; --bot:#f3f4f6;
    --warn:#9a6200; --warn-bg:#fff8e6; --warn-line:#f0d9a0; --err:#b4232a; --ok:#1a7f45;
    --radius:14px; --shadow:0 1px 2px rgba(16,17,26,.06), 0 8px 24px rgba(16,17,26,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0f1012; --panel:#16181c; --fg:#e9eaec; --muted:#9ba1a9; --faint:#6c737c;
      --line:#24272d; --accent:#5b8dff; --accent-soft:#1a2233;
      --me:#3f6fd8; --me-fg:#fff; --bot:#1d2025;
      --warn:#e0ab4a; --warn-bg:#2a2113; --warn-line:#4a3a1a; --err:#f07178; --ok:#5cc98c;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
    }
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body {
    margin:0; background:var(--bg); color:var(--fg);
    font:15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
    display:grid; grid-template-columns:264px minmax(0,1fr);
  }
  @media (max-width:820px) { body { grid-template-columns:1fr; } aside { display:none; } }

  /* ---------------------------------------------------------------- sidebar */
  aside { background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  .brand { padding:18px 18px 12px; font-weight:600; letter-spacing:-.01em; display:flex; align-items:center; gap:9px; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--ok); box-shadow:0 0 0 3px color-mix(in srgb, var(--ok) 20%, transparent); }
  .dot.off { background:var(--faint); box-shadow:none; }
  .newchat { margin:0 14px 12px; padding:9px 12px; border:1px solid var(--line); border-radius:10px;
             background:transparent; color:inherit; font:inherit; cursor:pointer; text-align:left; }
  .newchat:hover { background:var(--bot); }
  .side-h { padding:6px 18px; font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--faint); }
  .convs { flex:1; overflow:auto; padding:0 10px 10px; }
  .conv { padding:8px 10px; margin:1px 0; border-radius:9px; cursor:pointer; font-size:13.5px; color:var(--muted);
          overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .conv:hover { background:var(--bot); color:var(--fg); }
  .conv.active { background:var(--accent-soft); color:var(--fg); font-weight:500; }
  .modes { border-top:1px solid var(--line); padding:12px 14px 10px; }
  .modes label { font-size:11px; color:var(--faint); display:block; margin-bottom:6px; }
  .seg { display:flex; border:1px solid var(--line); border-radius:9px; overflow:hidden; }
  .seg button { flex:1; font:inherit; font-size:12.5px; padding:6px 4px; border:0; background:transparent;
                color:var(--muted); cursor:pointer; }
  .seg button + button { border-left:1px solid var(--line); }
  .seg button.on { background:var(--accent); color:#fff; }
  .modehint { font-size:11.5px; color:var(--faint); margin-top:6px; line-height:1.45; }

  /* The picker's styles live with the question panel below — see `.ask`. These global `.opt` rules were the
     in-transcript version's and are gone with it; two sets for one control is how they drift. */
  /* ---------------------------------------------------------------- usage panel */
  .usage { border-top:1px solid var(--line); padding:10px 14px; }
  .usage summary { font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--faint);
                   cursor:pointer; list-style:none; }
  .usage summary::-webkit-details-marker { display:none; }
  .usage summary::before { content:"▸ "; }
  .usage[open] summary::before { content:"▾ "; }
  .usage-empty, .usage-err { font-size:11.5px; color:var(--faint); margin-top:8px; line-height:1.45; }
  .usage-err { color:var(--err); }
  .usage-tot { display:grid; grid-template-columns:auto auto; gap:2px 10px; font-size:11.5px; margin:9px 0 2px; }
  .usage-tot dt { color:var(--faint); }
  .usage-tot dd { margin:0; text-align:right; font-variant-numeric:tabular-nums; }
  /* Bars, not a canvas: semantic HTML a screen reader can read and a stylesheet can restyle. */
  .usage-bars { display:flex; align-items:flex-end; gap:3px; height:38px; margin:10px 0 4px; }
  .usage-bar { flex:1; background:var(--accent-soft); border-radius:2px 2px 0 0; min-height:2px; }
  .usage-bar.on { background:var(--accent); }
  .usage-model { display:flex; justify-content:space-between; font-size:11.5px; color:var(--muted); margin-top:3px; }
  /* The quota track. `aria-valuenow` rather than a title, so the number is announced, not hovered. */
  /* ---- limits (#183) */
  .usage-h { margin:10px 0 5px; font-size:10.5px; text-transform:uppercase; letter-spacing:.07em;
             color:var(--faint); }
  .limit { margin-bottom:7px; }
  .limit-label { font-size:11px; color:var(--muted); margin-bottom:3px; }
  .limit-track { height:5px; border-radius:3px; background:var(--line); overflow:hidden; }
  .limit-track > span { display:block; height:100%; background:var(--accent); }
  /* Colour only where it means something: a bar that is orange from the first turn is a bar people stop
     reading. `over` is a limit already reached, which is a different fact from nearly reached. */
  .limit-track.warn > span { background:var(--warn); }
  .limit-track.over > span { background:#dc2626; }
  .limit-figures { font-size:10.5px; color:var(--faint); margin-top:2px; }
  .usage-quota { height:5px; border-radius:3px; background:var(--line); overflow:hidden; margin-top:9px; }
  .usage-quota > span { display:block; height:100%; background:var(--ok); }
  .usage-quota.warning > span { background:var(--warn); }
  .usage-quota.exceeded > span { background:var(--err); }

  .who { border-top:1px solid var(--line); padding:12px 14px; display:grid; gap:7px; }
  .who label { font-size:11px; color:var(--faint); display:block; margin-bottom:2px; }
  .who input, .who select { width:100%; padding:6px 9px; font:inherit; font-size:13px; border:1px solid var(--line);
                            border-radius:8px; background:var(--bg); color:inherit; }

  /* ---------------------------------------------------------------- chat */
  main { display:flex; flex-direction:column; min-width:0; min-height:0; }
  #log { flex:1; overflow-y:auto; padding:28px 0 8px; }
  .wrap { max-width:44rem; margin:0 auto; padding:0 24px; }
  .turn { display:flex; gap:12px; margin-bottom:22px; align-items:flex-start; }
  .turn.me { flex-direction:row-reverse; }
  .av { flex:0 0 28px; width:28px; height:28px; border-radius:8px; display:grid; place-items:center;
        font-size:12px; font-weight:600; margin-top:2px; }
  .av.bot { background:var(--bot); color:var(--muted); }
  .av.me  { background:var(--me); color:var(--me-fg); }
  .bubble { min-width:0; }
  .turn.me .bubble { background:var(--me); color:var(--me-fg); padding:10px 14px; border-radius:var(--radius);
                     border-top-right-radius:5px; max-width:min(38rem,100%); }
  .turn.bot .bubble { padding-top:2px; }
  .bubble p { margin:0 0 .7em; } .bubble p:last-child { margin-bottom:0; }
  .bubble h1,.bubble h2,.bubble h3 { font-size:1.03em; margin:1.1em 0 .4em; line-height:1.35; }
  .bubble ul,.bubble ol { margin:.2em 0 .8em; padding-left:1.35em; }
  .bubble li { margin:.18em 0; }
  .bubble code { font:13px/1.5 ui-monospace, SFMono-Regular, monospace; background:var(--bot);
                 padding:1.5px 5px; border-radius:5px; }
  .turn.me .bubble code { background:rgba(255,255,255,.18); }
  .bubble pre { background:var(--bot); padding:11px 13px; border-radius:10px; overflow-x:auto; margin:.5em 0 .9em; }
  .bubble pre code { background:none; padding:0; }
  .bubble table { border-collapse:collapse; margin:.4em 0 .9em; font-size:14px; display:block; overflow-x:auto; }
  .bubble th,.bubble td { border:1px solid var(--line); padding:5px 9px; text-align:left; }
  .bubble blockquote { margin:.4em 0; padding-left:11px; border-left:3px solid var(--line); color:var(--muted); }
  .caret { display:inline-block; width:7px; height:1.05em; background:var(--fg); vertical-align:-2px;
           margin-left:2px; animation:blink 1.05s steps(2) infinite; }
  @keyframes blink { 50% { opacity:0 } }

  /* tool trace, collapsed by default so it does not compete with the answer */
  .trace { margin:2px 0 8px; }
  .trace summary { cursor:pointer; font-size:12.5px; color:var(--faint); list-style:none; }
  .trace summary::-webkit-details-marker { display:none; }
  .trace summary::before { content:"▸ "; }
  .trace[open] summary::before { content:"▾ "; }
  .trace ol { margin:6px 0 0; padding-left:18px; font:12.5px/1.7 ui-monospace, monospace; color:var(--muted); }
  .trace .bad { color:var(--err); }
  .trace .good { color:var(--ok); }

  .gate { border:1px solid var(--warn-line); background:var(--warn-bg); border-radius:var(--radius);
          padding:14px 16px; margin:2px 0 10px; }
  .gate h4 { margin:0 0 3px; font-size:13px; color:var(--warn); letter-spacing:.01em; }
  .gate .d { font-size:14px; margin-bottom:9px; }
  .gate button { font:inherit; font-size:13.5px; padding:7px 15px; margin-right:8px; border-radius:9px;
                 border:1px solid var(--warn-line); background:var(--panel); color:inherit; cursor:pointer; }
  .gate button.primary { background:var(--warn); border-color:var(--warn); color:#fff; }
  .gate input { font:inherit; font-size:13.5px; padding:7px 10px; border:1px solid var(--warn-line);
                border-radius:9px; background:var(--panel); color:inherit; margin-right:8px; min-width:16rem; }
  /* The plan-ready bar. Accent rather than warn: offering to act is not a warning, and colouring it like the
     approval gate would make the two read as the same kind of decision. */
  .planbar { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin:10px 0 2px;
             padding:11px 14px; border:1px solid var(--accent); border-radius:var(--radius);
             background:var(--accent-soft); font-size:13.5px; }
  .planbar span { flex:1 1 14rem; color:var(--muted); }
  .planbar button { font:inherit; font-size:13.5px; padding:7px 15px; border-radius:9px; cursor:pointer;
                    border:1px solid var(--accent); background:var(--accent); color:#fff; }
  .planbar button:disabled { opacity:.6; cursor:default; }
  /* ---------------------------------------------------------------- citations */
  /* Under the answer, quieter than it. A source list that competes with the text it supports gets skipped. */
  .cites { margin-top:11px; padding-top:10px; border-top:1px solid var(--line); }
  .cites-h { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); margin-bottom:7px; }
  .cite { display:flex; gap:9px; align-items:flex-start; margin-bottom:8px; }
  /* A number, not a hue: the marker survives greyscale and colour-blindness. */
  .cite-n { flex:0 0 18px; height:18px; border-radius:5px; background:var(--accent-soft); color:var(--accent);
            font-size:11px; font-weight:650; display:grid; place-items:center; margin-top:1px; }
  .cite-src { font-size:12px; color:var(--muted); }
  /* The excerpt is the evidence. Quoted so it reads as somebody else's words. */
  .cite-q { font-size:13px; line-height:1.5; border-left:2px solid var(--line); padding-left:9px; margin-top:3px; }

  .note { font-size:12.5px; color:var(--faint); text-align:center; margin:14px 0; }
  .note.bad { color:var(--err); }

  .empty { max-width:44rem; margin:8vh auto; padding:0 24px; }
  .empty h2 { font-size:22px; letter-spacing:-.02em; margin:0 0 6px; }
  .empty p { color:var(--muted); margin:0 0 20px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { border:1px solid var(--line); background:var(--panel); border-radius:20px; padding:7px 14px;
          font:inherit; font-size:13.5px; cursor:pointer; color:var(--muted); }
  .chip:hover { border-color:var(--accent); color:var(--fg); }

  /* ---------------------------------------------------------------- composer */
  .composer { border-top:1px solid var(--line); background:var(--bg); padding:14px 0 18px; }
  .composer .wrap { display:flex; }
  /* The card. `focus-within` rather than `:focus` — the focus ring has to survive the caret being in the editor
     inside it, and it should also light up while the mode menu is open. */
  .box { flex:1; border:1px solid var(--line); border-radius:16px; background:var(--panel);
         box-shadow:var(--shadow); position:relative; transition:border-color .15s ease; }
  .box:focus-within { border-color:var(--accent); }
  /* ---- the editor */
  .tt-host { padding:12px 14px 2px; }
  /* ProseMirror's own node. `outline:none` because the card draws the focus ring for it. */
  .tt { outline:none; min-height:1.5em; max-height:11rem; overflow-y:auto; font:inherit; line-height:1.55;
        white-space:pre-wrap; word-break:break-word; }
  .tt p { margin:0; }
  .tt p + p { margin-top:.5em; }
  /* Tiptap's placeholder is a decoration on the empty first paragraph, not a `placeholder` attribute — which is
     the whole reason a contenteditable needs help here. */
  .tt p.is-editor-empty:first-child::before { content:attr(data-placeholder); color:var(--faint); float:left;
        height:0; pointer-events:none; }
  /* ---- the control bar */
  .bar { display:flex; align-items:center; gap:6px; padding:6px 8px 7px 10px; }
  .bar-gap { flex:1; }
  /* `.ctl`, not `.chip`: `.chip` is already the empty-state prompt pill above, and a second definition here
     quietly won on source order — 28px-tall pills where full sentences used to be. */
  .ctl { display:inline-flex; align-items:center; gap:5px; height:28px; padding:0 9px; border:1px solid var(--line);
          border-radius:9px; background:transparent; color:var(--muted); font:inherit; font-size:12.5px;
          cursor:pointer; }
  .ctl:hover { background:var(--accent-soft); border-color:#d3ddf7; color:var(--fg); }
  .ctl.icon { width:28px; padding:0; justify-content:center; font-size:15px; line-height:1; }
  /* Not `.caret`: that is the streaming cursor, styled by a bare class selector that would paint this as a
     7px black block. Two meanings for one class name in one file is a collision waiting for a coincidence. */
  .ctl .chev { font-size:10px; color:var(--faint); }
  .ctl .dot { width:6px; height:6px; border-radius:50%; background:var(--muted); }
  /* The mode's colour is the mode's meaning: plan changes nothing, auto asks nothing. Stated in the dot so the
     chip is readable at a glance without reading the word. */
  /* Prefixed, because these come from *data*: the mode keys are `auto|ask|plan`, and `.ask` is already the
     question panel's class — so `className = \`dot ${mode}\`` gave the 6px dot a panel's padding and shadow,
     34px wide. A class name derived from a value will eventually collide with a hand-written one; the prefix is
     what keeps the two namespaces apart. */
  .ctl .dot.m-plan { background:#8b5cf6; } .ctl .dot.m-auto { background:#f59e0b; } .ctl .dot.m-ask { background:#16a34a; }
  .ctl.mic-on { background:#fdecec; border-color:#f5c2c2; color:#b42318; }
  /**
   * The bar has to shrink somewhere, and this is where.
   *
   * Nothing in it shrank at first, so a narrow window pushed the send button past the edge — the one control in
   * there you cannot do without. The two labels are now out of the flow entirely: they live in a popover that is
   * `position:absolute`, so the row's width no longer depends on how long a model's name is. What is left in the
   * bar is an 18px ring.
   *
   * The measurement that motivated it: with both labels inline, the bar's min-content width was 561px, and at
   * 375px the send button sat outside the viewport. (Below roughly 660px the whole page overflows on the sidebar
   * anyway, which it did long before this composer and is not addressed here.)
   */
  .metaz { position:relative; display:inline-flex; align-items:center; justify-content:center; outline:none;
           /* A hit area: an 18px ring is small to aim at, and on a fresh conversation the ring is hidden
              altogether, which would leave nothing to hover at all. */
           min-width:22px; min-height:22px; border-radius:7px; }
  /* `:focus`, not `:focus-visible`. This element exists only to be focused — it has no other behaviour — so
     there is nothing about a mouse click worth suppressing, and `:focus` is the weaker precondition of the two.
     `:focus-visible` depends on a browser heuristic about how focus arrived; when the thing it gates is the only
     way a keyboard user can read a fact, the weaker selector is the right trade. */
  .metaz:hover, .metaz:focus { background:var(--accent-soft); }
  .metapop { position:absolute; bottom:calc(100% + 8px); right:0; display:flex; flex-direction:column; gap:2px;
             align-items:flex-end; padding:7px 9px; border:1px solid var(--line); border-radius:10px;
             background:var(--panel); box-shadow:0 10px 30px rgba(20,22,28,.13); white-space:nowrap;
             /* `visibility` as well as `opacity`: an opacity-0 popover is still a target sitting over the
                transcript. Both transition, so it fades rather than blinking. */
             opacity:0; visibility:hidden; transition:opacity .12s ease, visibility .12s ease; }
  .metaz:hover .metapop, .metaz:focus .metapop { opacity:1; visibility:visible; }
  .meta, #ctxtext { font-size:11.5px; color:var(--muted); }
  /* ---- the popovers, both anchored to the card */
  .ctl-menu, .cmd-menu { position:absolute; z-index:20; background:var(--panel); border:1px solid var(--line);
          border-radius:12px; box-shadow:0 10px 30px rgba(20,22,28,.13); padding:5px; min-width:15rem; }
  .ctl-menu { bottom:calc(100% - 34px); left:44px; }
  /* Above the card, because the card sits at the bottom of the window and a menu below it would be off-screen. */
  .cmd-menu { bottom:calc(100% + 7px); left:0; right:0; max-height:15rem; overflow-y:auto; }
  .cmd-row, .ctl-menu button { display:flex; width:100%; gap:9px; align-items:baseline; text-align:left;
          padding:7px 9px; border:0; border-radius:8px; background:transparent; font:inherit; color:inherit;
          cursor:pointer; }
  .cmd-row.on, .ctl-menu button:hover, .ctl-menu button.on { background:var(--accent-soft); }
  .cmd-name { font-family:ui-monospace, monospace; font-size:12.5px; color:var(--accent); }
  .cmd-summary { font-size:12px; color:var(--muted); }
  .ctl-menu button span:last-child { font-size:12px; color:var(--faint); }
  .go { width:30px; height:30px; flex:0 0 30px; border:0; border-radius:9px; background:var(--accent);
        color:#fff; font-size:15px; cursor:pointer; display:grid; place-items:center; margin-left:2px; }
  .go:disabled { opacity:.35; cursor:default; }
  .hint { font-size:11.5px; color:var(--faint); margin:7px auto 0; max-width:44rem; padding:0 24px; }
  .hint code { font:inherit; font-family:ui-monospace, monospace; }
  /* ---------------------------------------------------------------- context meter */
  /* Beside the send hint, not in a panel: how full the window is matters while you are typing into it. */
  .ctx { display:inline-flex; align-items:center; gap:6px; }
  /**
   * `hidden` has to be restored explicitly — #178.
   *
   * The attribute works through `[hidden] { display: none }` in the UA stylesheet, and any class rule that sets
   * `display` outruns it on specificity. So `<span class="ctx" hidden>` rendered anyway: an empty meter with a
   * filled track, showing as a stray blue bar next to the send hint on every fresh page.
   *
   * The element reported `hidden === true` the whole time, which is why it survived — the DOM said hidden and the
   * screen said otherwise.
   */
  .ctx[hidden] { display:none; }
  .ctx-ring { width:18px; height:18px; flex:0 0 auto; transform:rotate(-90deg); }
  .ctx-ring-track, .ctx-ring-fill { fill:none; stroke-width:2; }
  .ctx-ring-track { stroke:var(--line); }
  /* The arc is drawn by dash: one dash of `fraction × circumference`, then a gap longer than the circle. Rotated
     -90° above so it starts at twelve o'clock, which is where a gauge is read from. */
  .ctx-ring-fill { stroke:var(--accent); stroke-linecap:round; transition:stroke-dasharray .3s ease; }
  /* Warn only when it means something. A meter that is orange from the first turn is a meter people stop
     reading, so the colour changes at the threshold the server actually compacts at. */
  .ctx.warn .ctx-ring-fill { stroke:var(--warn); }
  /* `#ctxtext` moved out of `.ctx` into the popover, so this descendant selector no longer reaches it — the
     class goes on the wrapper too, and `loadContext` sets both. A rule that quietly stops matching is worse than
     one that errors: the ring would turn amber and the figure beside it would not. */
  .metaz.warn #ctxtext { color:var(--warn); }

  /* ---------------------------------------------------------------- the question panel */
  .ask { max-width:44rem; margin:0 auto 12px; padding:14px 16px; border:1px solid var(--warn-line);
         border-radius:var(--radius); background:var(--warn-bg); box-shadow:var(--shadow); }
  .ask .tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:11px; }
  /* A tab per question, so the shape of what is being asked is visible before answering any of it. */
  .ask .tab { font:inherit; font-size:12px; padding:5px 11px; border-radius:999px; cursor:pointer;
              border:1px solid var(--warn-line); background:transparent; color:var(--muted); }
  .ask .tab.on { background:var(--warn); border-color:var(--warn); color:#fff; }
  /* Answered tabs stay legible rather than going quiet — reviewing before submitting is the point. */
  .ask .tab.done { border-color:var(--ok); color:var(--ok); }
  .ask .tab.done.on { background:var(--ok); border-color:var(--ok); color:#fff; }
  .ask .q { font-size:14.5px; font-weight:550; margin:0 0 10px; }
  .ask .opts { display:grid; gap:7px; margin-bottom:11px; }
  .ask .opt { display:flex; align-items:center; gap:10px; padding:9px 12px; font-size:13.5px; cursor:pointer;
              border:1px solid var(--warn-line); border-radius:10px; background:var(--panel); }
  .ask .opt:hover { border-color:var(--warn); }
  .ask .opt input { margin:0; flex:0 0 auto; accent-color:var(--warn); }
  .ask .opt span { flex:1; }
  .ask .other { width:100%; font:inherit; font-size:13.5px; padding:9px 12px; margin-bottom:11px;
                border:1px solid var(--warn-line); border-radius:10px; background:var(--panel); color:inherit; }
  .ask .other:focus { outline:none; border-color:var(--warn); }

  <button class="newchat" id="new">＋  New conversation</button>
  <div class="side-h">Conversations</div>
  <div class="convs" id="convs"></div>
  <div class="modes">
    <label>Mode</label>
    <div class="seg" id="modes"></div>
    <div class="modehint" id="modehint"></div>
  </div>
  <!--
    Usage, collapsed by default. Open it and it fetches — a panel that polls in the background is a panel that
    bills you for looking at the page.
  -->
  <details class="usage" id="usage">
    <summary>Usage &amp; cost</summary>
    <div id="usage-body"><div class="usage-empty">…</div></div>
  </details>
  <div class="who">
    <div><label>Workspace</label><input id="tenant" value="demo" /></div>
    <div><label>You</label><input id="principal" value="you" /></div>
    <div><label>Role</label>
      <select id="role"><option value="editor">editor — can write &amp; share</option><option value="viewer">viewer — read only</option></select>
    </div>

</aside>

<main>
  <div id="log"></div>
  <div class="composer">
    <!--
      The question panel sits above the input, not in the message flow. A card that scrolls away with the
      transcript is a card you lose while reading back through the answer you were given, and a run parked on a
      question nobody can find is parked forever.
    -->
    <div class="ask" id="ask" hidden></div>
    <!--
      One card: the editor on top, its controls beneath. They are inside the same bordered box because they act
      on the same thing — a mode chip in a separate strip reads as a page setting, and the mode belongs to the
      message you are about to send.
    -->
    <div class="wrap">
      <div class="box" id="box">
        <!-- The menu is a sibling of the editor, not a child: inside it, the input's own overflow clips it. -->
        <div class="cmd-menu" id="cmdmenu" role="listbox" aria-label="Commands" hidden></div>
        <div class="tt-host" id="text"></div>
        <div class="bar">
          <!--
            `+` opens the command menu. It exists because the menu is otherwise only reachable by knowing to
            type `/`, and a button whose only job is to teach a keystroke is a fair use of a button. It is not
            an attachment control: the example has no file path to attach to, and a `+` that opened a file
            picker leading nowhere would be worse than no `+` at all.
          -->
          <button class="ctl icon" id="cmdopen" title="Commands (/)" aria-label="Commands">+</button>
          <!--
            The mode, on the composer rather than only in the sidebar. Modes decide whether this message can
            change anything, so it belongs next to the message. The sidebar selector stays and the two stay in
            step because both call `setMode` — there is one implementation and two ways to reach it.
          -->
          <button class="ctl mode" id="modechip" aria-haspopup="true" aria-expanded="false">
            <span class="dot" id="modedot"></span><span id="modechiptext">Ask</span><span class="chev">⌄</span>
          </button>
          <div class="ctl-menu" id="modemenu" role="listbox" aria-label="Mode" hidden></div>
          <!--
            Dictation, and hidden outright where the browser has no speech recognition rather than shown
            disabled. A control that is present but never works is a bug report; an absent one is a browser
            difference. Chrome has it behind `webkitSpeechRecognition`; Firefox has nothing.
          -->
          <button class="ctl icon" id="mic" title="Dictate" aria-label="Dictate" hidden>🎤</button>
          <span class="bar-gap"></span>
          <!--
            What is about to run, and how full its window is — **on hover**, not spelled out in the bar.

            Both are facts you want occasionally and never while typing, and written out they were the widest
            things in the row: `gpt-4o · api.openai.com` beside `~109k / 128k context` left no room for the send
            button on a narrow window. The ring stays, because a shape is read at a glance without being read;
            the words are one hover away.

            `tabindex="0"` so it is reachable without a mouse — a hover-only fact is a fact some people cannot
            get to. The popover is `position:absolute`, so revealing it moves nothing.

            A ring rather than a bar, while we are here: how full the window is has a natural whole, and a circle
            shows a proportion of one without needing its ends labelled. `r=7` with a 2px stroke fits the 28px
            control height the rest of the bar uses.
          -->
          <span class="metaz" id="metaz" tabindex="0" role="group" aria-label="Model and context window">
            <span class="metapop">
              <span class="meta" id="modelmeta"></span>
              <span id="ctxtext"></span>
            </span>
            <span id="ctxmeter" class="ctx" hidden role="img">
              <svg class="ctx-ring" viewBox="0 0 18 18" aria-hidden="true">
                <circle class="ctx-ring-track" cx="9" cy="9" r="7" />
                <circle class="ctx-ring-fill" id="ctxfill" cx="9" cy="9" r="7" />
