    <path d="M16 48V40" /><path d="M32 48V30" /><path d="M48 48V20" />
  </g>
  <circle cx="48" cy="9" r="4.5" fill="#4f81bd" />
  <text x="72" y="41" font-family="Onest, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="26" letter-spacing="-0.4">
    <tspan fill="#234b7e" font-weight="650">Rise</tspan><tspan fill="#4f81bd" font-weight="400">-</tspan><tspan fill="#234b7e" font-weight="400">Experts</tspan>
  </text>
</svg>
