name: CI

# Runs on GitHub-hosted runners. That is not a preference — it is what became possible, and what became
# necessary, when the repository went public.
#
# The history, because it explains every other decision in this file. Hosted minutes were exhausted on a private
# repository, and every job failed in two seconds without being assigned a machine: no steps, no logs, just a
# red cross on every push. CI moved to a self-hosted runner, which is not metered. That worked and carried one
# hazard: on a *public* repository a self-hosted runner executes a fork's pull request on your own hardware, by
# design. It was held off by a `guard` job that skipped fork pull requests entirely — protection bought by
# denying external contributors any CI at all.
#
# Public + hosted resolves both. Minutes are free, `ubuntu-latest` is ephemeral and isolated, and GitHub already
# withholds secrets from a fork's `pull_request` run — so a fork's PR is safe to build, and now does get built.
# The guard job is gone with the hazard it guarded.
#
# What replaces it is a check rather than a comment: `ci-local.mjs --verify` fails if any workflow that triggers
# on `pull_request` also names a self-hosted runner. Re-adding one is a decision somebody has to make against a
# failing gate, not something that quietly reintroduces arbitrary code execution.
#
# `npm run ci:local` runs the same commands on a developer machine, and `ci-local.mjs --verify` fails if this
# file gains a command the local runner does not have — so the two cannot drift.
on:
  push:
    branches: [main]
  pull_request:
  #
  # Lets CI be re-run against a branch on demand. Added because a push to main landed the ref without
  # firing a run (72b2d35), and there was then no way to get CI to look at that tree at all -- the
  # only options were an empty commit or waiting for the next change to hide it.
  #
  # Also how the release gate is overridden (#142). `override_reason` is required by the CLI to be non-blank when
  # set; leaving it empty runs the gate normally.
  workflow_dispatch:
    inputs:
      override_reason:
        description: "Override a failing release gate — state why. Recorded in evals/trend.json with your username."
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      # #105's ACs -- work surviving with no worker, BullMQ's own jobId dedup, and a typed error on an
      # unreachable Redis -- cannot be shown by a fake queue. Without this service those cases skip by
      # name in CI and the guarantees would only ever be verified on someone's laptop.
      redis:
        image: redis:7-alpine
        # 6479, not 6379. A hosted runner would be fine with the default, but the Jenkins agent and developer
        # machines are servers that very likely already run a Redis — and one port per service across all three
        # is what keeps `RETINUE_TEST_REDIS_URL` a single value. A service container binding an occupied port
        # fails the job with a message about Docker rather than about the clash.
        ports: ["6479:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      # Build *before* test, since #142: the release-gate CLI is a thin wrapper importing @retinue/agentkit, so
      # its tests need the built package. Running them against a stale dist is worse than against none -- they
      # pass or fail against the previous build's logic, which cost an hour of confusion when the gate was added.
      - name: Build
        run: npm run build
      # Straight after the build, because it is a question about the built artifact and not about the source:
      # `npm pack`, extract, and try to import past the exports map from outside. It is the only check that sees
      # the package the way #195's platform will — installed, with no `src/` within reach.
      - name: Package boundary (as installed)
        run: npm run check:consumer
      - name: Test
        env:
          RETINUE_TEST_REDIS_URL: redis://localhost:6479
        run: npm test
      - name: Dependency boundaries
        run: npm run check:boundaries
      - name: Eval dataset coverage
        run: npm run evals:coverage

  # The conformance matrix (#92). Separate job because it needs a real PostgreSQL server: PGlite
  # cannot exercise advisory locks or SKIP LOCKED, and those are exactly the primitives the run
  # coordinator and lease-based claim depend on. Required, not advisory — an advisory gate is not a
  # gate, which is the lesson of #20 closing green against "passes the full conformance suite".
  conformance-matrix:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentkit_test
        # 5442 for the same reason as Redis's 6479: one port per service across hosted CI, Jenkins and laptops.
        ports: ["5442:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install
      # Build, for the same reason the `build` job does it before `npm test`: three tests in this suite read the
      # *built* package — `public-surface` imports it in a child node through the `exports` map, and
      # `root-import-weight` walks the graph from `dist/index.js`. Without a build they fail with three confusing
      # messages about a missing module.
      #
      # This job had therefore been incapable of passing since those tests landed, and nobody knew: hosted
      # minutes were exhausted and no self-hosted runner was ever registered, so it had not run. Going public is
      # what surfaced it. A job that cannot pass and never runs is indistinguishable from a job that passes.
      - name: Build
        run: npm run build
      - name: Conformance suite (real PostgreSQL)
        env:
          RETINUE_TEST_PG_URL: postgres://postgres:postgres@localhost:5442/agentkit_test
        run: npm run conformance:report
      - name: Publish matrix
        # always(): a regression must still publish the table, or the job fails without showing
        # which cell broke. This step also fails on an unaccounted cell, so it is a gate too.
        if: always()
        run: npm run conformance:matrix
      - name: Upload matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-matrix
          path: |
            backend/.conformance/conformance-matrix.json
            backend/.conformance/conformance-matrix.md
            # The raw run, not only the derived table. The first hosted run of this job failed and the matrix
            # artifact was entirely green — because the matrix covers port × adapter cells and the failing test
            # was not one of them, so the only artefact said nothing about the only failure. The JSON reporter
            # also suppresses per-test output, which is why `conformance:report` now runs `default` alongside it:
            # a job whose log cannot name what failed is a job that gets re-run instead of read.
            backend/.conformance/vitest.json
          if-no-files-found: error

  # The release gate (#142). REQ-032 requires this to be *required for release* and deliberately not on every
  # push: scoring the dataset against a live model costs real money per run, and a gate expensive enough to
  # matter is one people disable if it fires on every commit. So it runs on a release tag, and on demand.
  #
  # `workflow_dispatch` carries the override. The actor is `github.actor` -- the person who clicked, not a
  # service account -- and the reason is text they had to type. Neither can be defaulted, which is the whole
  # mechanism: an override that could be supplied by automation is an override nobody is accountable for.
  release-gate:
    # `agentkit@…` / `react@…`, not `v…`. #193 made release tags name their package, because the versions are
    # independent — and this condition still said `refs/tags/v`, which no tag will ever match again. A gate that
    # stops firing is worse than one that fails: nothing reports, and the absence looks like nothing to report.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       (startsWith(github.ref, 'refs/tags/agentkit@') || startsWith(github.ref, 'refs/tags/react@')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install
      - name: Build
        run: npm run build
      - name: Dataset coverage
        # The gate is meaningless against a dataset that has quietly shrunk, so the coverage floor runs first.
        run: npm run evals:coverage
      - name: Release gate
        env:
          # Empty unless the dispatch supplied them. The CLI refuses *half* an override rather than ignoring it,
          # so a blank reason with an actor set fails loudly instead of shipping unrecorded.
          RETINUE_GATE_OVERRIDE_ACTOR: ${{ inputs.override_reason && github.actor || '' }}
          RETINUE_GATE_OVERRIDE_REASON: ${{ inputs.override_reason || '' }}
        # --record appends to evals/trend.json; the commit below is what makes the trend accumulate.
        #
        # THE GAP, STATED. `RETINUE_EVAL_REPORT` is a scored run, and producing one needs a deployed runtime to
        # score against -- which lands with the ShareFlow cutover, not here. Until then this step fails with a
        # message naming why, rather than skipping: a gate that skips when its input is missing is a gate that
        # silently stops gating the day someone renames a variable. It only fires on a release tag and there are
        # none yet, so it is not crying wolf on ordinary pushes -- and it is deliberately NOT yet in the branch
        # protection required checks, because a required check that cannot pass blocks every release. Adding it
        # there is the last step of the cutover, and docs/09 says so.
        run: |
          if [ -z "${RETINUE_EVAL_REPORT:-}" ] || [ ! -f "$RETINUE_EVAL_REPORT" ]; then
            echo "✗ no scored eval report at '${RETINUE_EVAL_REPORT:-<unset>}'."
            echo "  The gate is implemented and tested; producing a scored run needs a deployed runtime."
            echo "  See docs/09-quality-and-release.md -> 'The gate's live half'."
            exit 2
          fi
          node scripts/release-gate.mjs --report "$RETINUE_EVAL_REPORT" --record --release "${GITHUB_REF_NAME}"
      - name: Record the trend
        # always(): a *failed* gate must still record its entry, or the trend shows only the releases that passed
        # and reads as an unbroken record of quality. That is the history this file exists to prevent.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add evals/trend.json
          git diff --cached --quiet || git commit -m "chore(evals): record the ${GITHUB_REF_NAME} release gate result"
          git push origin HEAD:main || echo "trend not pushed (detached tag build); the artifact below holds it"
      - name: Upload the gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate
          path: evals/trend.json
          if-no-files-found: warn

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install (website)
        run: npm ci
        working-directory: website
      - name: Build docs site
        # prebuild installs the workspace (npm --prefix .. ci) so TypeDoc resolves backend deps
        run: npm run build
        working-directory: website
      # No network: it compares the built output with the config. The networked half of this check is a command
      # for the #203 cutover, deliberately not a CI step — a gate that fails when DNS is slow is one people
      # learn to skip.
      - name: Docs site hostname
        run: npm run check:domain -- --offline

  image:
    # The image build is the only check that the application layer declares every dependency it
    # imports: the runtime declares its heavy dependencies as optional peers, so inside this repo they
    # resolve by hoisting from the runtime's devDependencies and an under-declared app works anyway.
    # The runtime stage installs with --omit=dev, so there it does not. This job also catches a
    # Dockerfile left pointing at a workspace that no longer exists, which is how it started: #196
    # merged the `server` workspace into the runtime package and the Dockerfile still copied it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t retinue:ci .
      - name: The host must at least start and answer /healthz
        # No database here, so readiness is expected to fail; liveness must not. A process that exits
        # because a dependency is missing turns a dependency blip into a restart storm.
        run: |
          docker run -d --name retinue-ci -p 4000:4000 \
            -e RETINUE_DATABASE_URL=postgres://nobody@127.0.0.1:1/none \
            -e RETINUE_REDIS_URL=redis://127.0.0.1:1 \
            -e RETINUE_EXAMPLE_DEV_AUTH=1 \
            retinue:ci
          for i in $(seq 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4000/healthz || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          docker logs retinue-ci
          test "$code" = "200"
      - name: Cleanup
        if: always()
        run: docker rm -f retinue-ci || true
