# Publishing, from a tag, in CI — SPEC #193.
#
# The rule this file exists to make true: a publish happens from a tagged CI release or it does not happen. A
# `npm publish` from a workstation ships a tarball built from an unknown working tree, the version number is
# permanent, and the only record of what went into it is one person's shell history. `scripts/publish-guard.mjs`
# is wired as `prepublishOnly` on both packages, so it is npm itself that refuses — this workflow is the *only*
# environment that guard accepts, and it accepts it because of the three facts below (Actions, a tag, this
# workflow's name).
#
# ## The tag names the package
#
# `agentkit@0.1.0`, `react@0.2.0-next.1`. #193 requires independent versions per package — "a client-only fix
# should not bump the runtime" — and a single `v0.1.0` cannot express which package it releases. The first
# release is therefore two tags, which is the honest shape rather than a coordinated one pretending to be
# independent. `scripts/release-target.mjs` resolves the tag and refuses one that disagrees with the manifest:
# npm takes the version from `package.json`, so `agentkit@0.1.1` over a manifest saying `0.1.0` publishes a
# version nobody wrote.
#
# ## Why `ubuntu-latest` and not the self-hosted runner CI uses
#
# Both of the things that make a release trustworthy require a *cloud* runner:
#
#   - **npm provenance** is not generated from a private source repository at all, and not from a self-hosted
#     runner. GitHub withdrew private-repo provenance in July 2023.
#   - **npm trusted publishing** (short-lived OIDC credentials instead of a long-lived token) explicitly does not
#     support self-hosted runners yet.
#
# So this workflow cannot run until the repository is public — at which point hosted minutes are free, which is
# also what unblocks ordinary CI. The preflight below fails with that sentence rather than letting npm fail with
# a cryptic one, because "the release is broken" and "the release cannot be trustworthy while the repo is
# private" are different problems and only one of them is fixable here.
name: Release

on:
  push:
    # Anything with an `@`; `release-target.mjs` is the validator, and it explains a wrong tag better than a glob
    # can. A malformed tag reaches a job that fails in ten seconds with a sentence.
    tags: ["*@*"]

# Least privilege, and `id-token` is not optional: it is what provenance and trusted publishing are built on.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Provenance needs a public repository
        # Deliberately first, before checkout: nothing below is worth doing if the artefact cannot carry
        # provenance, and discovering that at the publish step means discovering it after the gate has run for
        # fifteen minutes.
        run: |
          if [ "${{ github.event.repository.private }}" = "true" ]; then
            echo "✗ this repository is private, so npm cannot generate provenance for a publish from it."
            echo "  GitHub withdrew provenance for private source repositories in July 2023, and npm trusted"
            echo "  publishing does not support self-hosted runners — so there is no configuration of this"
            echo "  workflow that produces a provenance-carrying release while the repo is private."
            echo ""
            echo "  Two ways forward, and they are a decision rather than a fix:"
            echo "   1. make the repository public — hosted Actions minutes then cost nothing either, which is"
            echo "      what has had CI switched off; or"
            echo "   2. publish without provenance, by deleting this step and the --provenance flag below."
            echo ""
            echo "  Option 1 publishes the whole git history. Rotate every credential ever committed first."
            echo "  See docs/19-versioning.md → 'Releasing'."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22, not the package's 20 floor: trusted publishing needs npm >= 11.5.1, which ships with Node 22.
          # The package still supports 20 — that is what `engines` says, and the conformance suite is what proves
          # it. This is the version of the machine doing the publishing.
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      - name: Resolve the tag
        id: target
        # Refuses a tag that names a package we do not publish, or a version the manifest disagrees with.
        run: |
          node scripts/release-target.mjs "$GITHUB_REF" --json | tee target.json
          echo "workspace=$(node -e "console.log(require('./target.json').workspace)")" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$(node -e "console.log(require('./target.json').distTag)")" >> "$GITHUB_OUTPUT"

      - name: The gate
        # The whole gate, and a failure blocks the publish rather than warning (#193 AC-4). This is the same
        # command a developer runs, so a release cannot pass a check that a workstation does not have.
        run: npm run release:check

      - name: Publish
        env:
          # Trusted publishing supersedes this and needs no secret at all, but it cannot be configured for a
          # package that does not exist yet — so the first release of each package uses a granular automation
          # token, and the trusted publisher is configured afterwards. The token must be CI-only: a token that
          # also works on a laptop makes the guard the only thing standing between a working tree and the
          # registry.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # `--access public` explicitly: a first publish under a scope defaults to restricted, and a "published"
        # package nobody can install is the failure that looks like success.
        run: |
          npm publish -w ${{ steps.target.outputs.workspace }} \
            --provenance --access public --tag ${{ steps.target.outputs.dist_tag }}

      - name: What a consumer now gets
        # The published artefact, installed from the registry into a scratch project outside this repository —
        # #193 AC-6, "verified by an actual install, not by a build". It also re-checks that a deep import fails
        # (AC-7) against the real thing rather than a tarball.
        #
        # `--only` scopes it to the package this tag released, and that is the fix for a real failure: the first
        # toolkit release went red because `@retinue/agentkit@0.1.0` — published weeks earlier, before the
        # `guardrails` subpath and the README rewrite — does not satisfy *today's* checkout. Both facts were true
        # and neither was about the release being verified. A release verifies what it just published; version
        # skew against other published packages is a different question, and a red build is a bad way to ask it.
        run: npm run check:consumer -- --published --only ${{ steps.target.outputs.workspace }}
